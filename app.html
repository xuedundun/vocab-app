<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1DB954">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>高考词汇速通关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1DB954;--greenD:#169C45;--blue:#4A90D9;--orange:#FF8C42;--red:#FF5252;--bg:#F2F4F6;--card:#fff;--text:#1a1a2e;--gray:#8E8E93;--light:#E5E7EB;--radius:22px;--shadow:0 4px 20px rgba(0,0,0,.05)}
body{font-family:-apple-system,'PingFang SC','SF Pro Display',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;position:relative}
.app{padding-bottom:95px;min-height:100vh}

/* Header */
.header{background:linear-gradient(135deg, #1DB954 0%, #17A34A 100%);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-radius:0 0 20px 20px;margin:0;box-shadow:0 4px 20px rgba(29,185,84,.25)}
.header .logo{color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.header .logo svg{width:22px;height:22px}
.header .streak{background:rgba(255,255,255,.18);color:#fff;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px;backdrop-filter:blur(10px)}

/* Bottom Nav */
.tabs{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;background:rgba(255,255,255,.92);display:flex;border-radius:20px;z-index:100;box-shadow:0 4px 30px rgba(0,0,0,.1);padding:6px 4px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab{flex:1;text-align:center;padding:7px 0 5px;font-size:10px;color:var(--gray);cursor:pointer;transition:.2s;border-radius:16px;font-weight:600}
.tab.active{color:var(--green);background:#E8FAEF}
.tab .ic{font-size:20px;display:block;margin-bottom:1px;line-height:1;font-weight:700}
.tab .badge{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;position:absolute;margin-left:12px;margin-top:-26px;min-width:15px;text-align:center}

/* Card */
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin:14px 16px;box-shadow:var(--shadow)}
.card-title{font-size:17px;font-weight:700;margin-bottom:6px}

/* Buttons */
.btn{display:inline-block;padding:15px 32px;border-radius:16px;font-size:16px;font-weight:700;border:none;cursor:pointer;text-align:center;transition:all .15s;border-bottom:4px solid transparent;letter-spacing:.3px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn-g{background:var(--green);color:#fff;border-bottom-color:var(--greenD)}
.btn-b{background:var(--blue);color:#fff;border-bottom-color:#3A7BC8}
.btn-o{background:var(--orange);color:#fff;border-bottom-color:#E07A30}
.btn-w{background:var(--card);color:var(--text);border:2px solid var(--light);border-bottom:4px solid var(--light)}
.btn-blk{display:block;width:100%}
.btn:disabled{opacity:.45;pointer-events:none}

/* Progress Ring */
.progress-ring{position:relative;width:130px;height:130px;margin:20px auto}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .bg{fill:none;stroke:#E5E7EB;stroke-width:8}
.progress-ring .fg{fill:none;stroke:url(#grad);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.progress-ring .txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.progress-ring .big{font-size:34px;font-weight:800;color:var(--green);line-height:1}
.progress-ring .sub{font-size:11px;color:var(--gray);margin-top:3px;font-weight:500}

/* Flashcard */
.flashcard{background:var(--card);border-radius:var(--radius);padding:40px 28px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;margin:14px 16px;transition:transform .2s;position:relative}
.flashcard:active{transform:scale(.98)}
.flashcard .w{font-size:38px;font-weight:800;color:var(--text);letter-spacing:.5px}
.flashcard .star{color:var(--orange);font-size:22px;margin-left:4px}
.flashcard .m{font-size:21px;color:#555;margin-top:18px;text-align:center;line-height:1.4}
.flashcard .hint{font-size:13px;color:var(--gray);margin-top:14px}
.flashcard .tag{position:absolute;top:14px;right:16px;font-size:12px;padding:5px 12px;border-radius:12px;font-weight:600}
.tag-new{background:#E8FAEF;color:var(--green)}
.tag-rev{background:#FFF3E0;color:var(--orange)}

/* Phase cards */
.phase-card{background:var(--card);border-radius:var(--radius);padding:18px;margin:14px 16px;box-shadow:var(--shadow)}
.phase-card .ph-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.phase-card .ph-icon{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.phase-card .ph-info{flex:1}
.phase-card .ph-name{font-size:16px;font-weight:700}
.phase-card .ph-sub{font-size:12px;color:var(--gray);margin-top:2px}
.phase-card .ph-count{font-size:30px;font-weight:800;color:var(--green)}
.phase-bar{height:6px;background:var(--light);border-radius:3px;overflow:hidden}
.phase-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.level-dot{text-align:center;padding:7px 2px;background:var(--bg);border-radius:12px;font-size:9px;font-weight:700;cursor:pointer;transition:.15s;color:var(--gray)}
.level-dot.done{background:#E8FAEF;color:var(--greenD)}
.level-dot.today{background:var(--green);color:#fff}
.level-dot.locked{opacity:.25;pointer-events:none}

/* Quiz */
.quiz-word{font-size:34px;font-weight:800;text-align:center;padding:28px;color:var(--text)}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.quiz-opt{padding:18px 14px;background:var(--card);border:2px solid var(--light);border-radius:16px;font-size:15px;text-align:center;cursor:pointer;transition:.15s;font-weight:500}
.quiz-opt:active{background:var(--bg);transform:scale(.97)}
.quiz-opt.correct{border-color:var(--green);background:#E8FAEF}
.quiz-opt.wrong{border-color:var(--red);background:#FFF0F0}

/* Stats */
.stat-row{display:flex;gap:10px;margin:0 16px 14px}
.stat-box{flex:1;background:var(--card);border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow)}
.stat-box .num{font-size:30px;font-weight:800;color:var(--green)}
.stat-box .lbl{font-size:11px;color:var(--gray);margin-top:5px;font-weight:500}

/* Passages */
.passage-card{background:var(--card);border-radius:var(--radius);padding:20px;margin:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.passage-card:active{transform:scale(.98)}
.passage-card .ps-title{font-size:16px;font-weight:700;margin-bottom:4px}
.passage-card .ps-tag{font-size:11px;color:var(--gray);margin-bottom:6px}
.passage-preview{font-size:13px;color:var(--gray);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pw-high{font-weight:700;color:var(--green);background:#E8FAEF;padding:1px 4px;border-radius:3px}

/* Full passage view */
.full-passage{line-height:1.9;font-size:15px;padding:4px 0}

/* Review list */
.review-item{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--card);border-radius:18px;margin:8px 16px;box-shadow:0 1px 6px rgba(0,0,0,.03);cursor:pointer}
.review-item:active{background:var(--bg)}
.review-item .ri-left{display:flex;align-items:center;gap:12px}
.review-item .ri-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.review-item .ri-title{font-size:15px;font-weight:600}
.review-item .ri-sub{font-size:12px;color:var(--gray);margin-top:1px}
.review-item .ri-badge{background:var(--red);color:#fff;font-size:12px;padding:4px 13px;border-radius:14px;white-space:nowrap;font-weight:600}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.88);color:#fff;padding:14px 30px;border-radius:30px;font-size:15px;font-weight:600;z-index:999;pointer-events:none;animation:ti .3s}
@keyframes ti{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* Loading */
#loadingBox{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#loadingBox .spinner{width:36px;height:36px;border:3px solid var(--light);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingBox p{margin-top:14px;color:var(--gray);font-size:14px;font-weight:500}

/* Empty */
.empty{text-align:center;padding:70px 20px}
.empty .num{font-size:56px;margin-bottom:12px;font-weight:300;color:var(--gray)}
.empty h3{font-size:18px;font-weight:700;margin-bottom:4px}
.empty p{font-size:14px;color:var(--gray)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-box{background:#fff;border-radius:26px;padding:30px 24px;width:100%;max-width:370px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-box h3{font-size:20px;font-weight:800;margin-bottom:4px}
.modal-box .score{font-size:60px;font-weight:800;color:var(--green);margin:14px 0}
.modal-box .share-text{background:var(--bg);padding:14px;border-radius:14px;font-size:12px;line-height:1.6;text-align:left;white-space:pre-wrap;margin:12px 0}
</style>
<svg width="0" height="0"><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#1DB954"/><stop offset="100%" style="stop-color:#17A34A"/></linearGradient></defs></svg>
</head>
<body>

<div id="loadingBox"><div class="spinner"></div><p id="loadMsg">正在准备词汇数据...</p></div>

<div id="app" style="display:none">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><rect x="3" y="2" width="18" height="20" rx="3"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>
      高考词汇速通关
    </div>
    <div class="streak" id="streakBadge">🔥 0天</div>
  </div>
  <div id="mainContent"></div>
</div>

<nav class="tabs" id="tabs" style="display:none">
  <div class="tab active" data-tab="study"><span class="ic">今</span>今日</div>
  <div class="tab" data-tab="levels"><span class="ic">闯</span>闯关</div>
  <div class="tab" data-tab="passages"><span class="ic">文</span>短文</div>
  <div class="tab" data-tab="review"><span class="ic">复</span>复习<span class="badge" id="rvBadge" style="display:none">0</span></div>
  <div class="tab" data-tab="profile"><span class="ic">我</span>我的</div>
</nav>

<script>
var script = document.createElement('script');
script.src = 'vocab-data.js';
script.onload = function(){ setTimeout(initApp, 150); };
script.onerror = function(){ document.getElementById('loadMsg').innerHTML = '加载失败<br><button onclick=location.reload() style="margin-top:12px;padding:10px 24px;border-radius:16px;background:#1DB954;color:#fff;border:none;font-size:14px;font-weight:700">重试</button>'; };
document.head.appendChild(script);

var EBB = [1,2,4,7,15];
var HIGH_DAILY = 100;
var FULL_DAILY = 150;
var tab = 'study';
var fcIdx = 0, fcWords = [], flipped = false;
var qzIdx = 0, qzWords = [], qzScore = 0;

// 高频词集合（用于正式阶段★标记）
var HIGH_SET = null;
function getHighSet(){
  if(HIGH_SET)return HIGH_SET;
  HIGH_SET = {};
  for(var i=0;i<10;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++)HIGH_SET[lv.words[j].w.toLowerCase()]=true;
  }
  return HIGH_SET;
}

function isHigh(w){ return getHighSet()[w.toLowerCase()]||false; }

function today(){ return new Date().toISOString().slice(0,10); }
function load(){ try{ return JSON.parse(localStorage.getItem('xd_v')||'{}'); }catch(e){ return {}; } }
function save(d){ localStorage.setItem('xd_v',JSON.stringify(d)); }
function toast(m){ var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1500); }

function getPhase(p){ return ((p.done||[]).length < 10) ? 'high' : 'full'; }
function getDailyTarget(p){ return getPhase(p)==='high' ? HIGH_DAILY : FULL_DAILY; }
function getPhaseDay(p){ var d=(p.done||[]).length; return getPhase(p)==='high' ? d+1 : d-9; }
function getPhaseName(p){ return getPhase(p)==='high' ? '高频速通' : '正式背诵'; }

function initApp(){
  document.getElementById('loadingBox').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('tabs').style.display = 'flex';
  var p=load(); document.getElementById('streakBadge').innerHTML = '🔥 '+(p.days||0)+'天';
  render();
}

function switchTab(t){ tab=t;document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('active',el.dataset.tab===t);});render(); }
document.getElementById('tabs').addEventListener('click',function(e){ var el=e.target.closest('.tab');if(el)switchTab(el.dataset.tab); });

function todayWords(){
  var p=load(),ts=today(),words=[];
  var phase=getPhase(p),dailyTarget=getDailyTarget(p);
  var startLv=phase==='high'?0:10,endLv=phase==='high'?10:30;

  // 新词
  var newPool=[];
  for(var i=startLv;i<endLv;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){ var w=lv.words[j],ws=p[w.w]||{}; if(!ws.seen)newPool.push({w:w.w,m:w.m,lid:lv.id,isNew:true,isH:isHigh(w.w)}); }
  }

  // 复习词（全阶段，包括高频词回顾）
  var revPool=[];
  for(var i=0;i<LEVELS.length;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){ var w=lv.words[j],ws=p[w.w]; if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')revPool.push({w:w.w,m:w.m,lid:lv.id,isRev:true,rnd:ws.rnd||0,isH:isHigh(w.w)}); }
  }

  // 正式阶段：额外混入高频词（未掌握的需要回顾）
  if(phase==='full'){
    var extraHigh=[];
    for(var i=0;i<10;i++){ var lv=LEVELS[i];
      for(var j=0;j<lv.words.length;j++){ var w=lv.words[j],ws=p[w.w]||{};
        if(ws.s&&ws.nr!=='2099-01-01'&&(!ws.nr||ws.nr>ts)){ extraHigh.push({w:w.w,m:w.m,lid:lv.id,isRev:true,rnd:ws.rnd||0,isH:true}); }
      }
    }
    // 随机取一部分混入
    extraHigh.sort(function(){return Math.random()-.5});
    revPool = revPool.concat(extraHigh.slice(0,30));
    // 去重
    var seen={}; revPool=revPool.filter(function(x){var k=x.w;if(seen[k])return false;seen[k]=true;return true;});
  }

  var newTake=newPool.slice(0,Math.max(0,dailyTarget-revPool.length));
  return revPool.concat(newTake);
}

function render(){
  var p=load(),c=document.getElementById('mainContent');
  updateBadge(p);
  document.getElementById('streakBadge').innerHTML = '🔥 '+(p.days||0)+'天';
  if(tab==='study')renderStudy(c,p);
  else if(tab==='levels')renderLevels(c,p);
  else if(tab==='passages')renderPassages(c,p);
  else if(tab==='review')renderReview(c,p);
  else if(tab==='profile')renderProfile(c,p);
}

function updateBadge(p){
  var ts=today(),cnt=0;
  for(var i=0;i<LEVELS.length;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){ var ws=p[lv.words[j].w]; if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')cnt++; }
  }
  var b=document.getElementById('rvBadge');
  if(cnt>0){ b.style.display='inline';b.textContent=cnt>99?'99+':cnt; } else b.style.display='none';
}

// ====== TAB1: 今日背诵 ======
function renderStudy(c,p){
  var words=todayWords();
  var dailyTarget=getDailyTarget(p),phaseName=getPhaseName(p),phaseDay=getPhaseDay(p);

  var totalPhase=getPhase(p)==='high'?971:(TOTAL-971);
  var seenInPhase=0;
  var sl=getPhase(p)==='high'?0:10,el=getPhase(p)==='high'?10:30;
  for(var i=sl;i<el;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){ if(p[lv.words[j].w]&&p[lv.words[j].w].s)seenInPhase++; }
  }
  var pct=Math.round(seenInPhase/totalPhase*100);
  var circ=2*Math.PI*55,off=circ*(1-pct/100);

  if(words.length===0){
    c.innerHTML='<div class="empty"><div class="num">🎉</div><h3>今日任务完成</h3><p>'+phaseName+' · 第'+phaseDay+'天 · 已学'+seenInPhase+'/'+totalPhase+'词</p><button class="btn btn-g btn-blk" style="max-width:200px;margin:16px auto" onclick="switchTab(\'levels\')">去闯关测试</button></div>';
    return;
  }

  fcWords=words;fcIdx=0;flipped=false;
  var hwCount=words.filter(function(w){return w.isH;}).length;

  c.innerHTML=
    '<div style="text-align:center;padding:18px 16px 0">'+
    '<div style="font-size:12px;font-weight:600;color:var(--gray);letter-spacing:1px;text-transform:uppercase">'+phaseName+' · 第'+phaseDay+'天</div>'+
    '<div class="progress-ring"><svg width="130" height="130" viewBox="0 0 130 130"><circle class="bg" cx="65" cy="65" r="55"/><circle class="fg" cx="65" cy="65" r="55" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/></svg>'+
    '<div class="txt"><div class="big">'+pct+'%</div><div class="sub">'+seenInPhase+'/'+totalPhase+'</div></div></div>'+
    '<div style="font-size:14px;color:var(--gray);margin-bottom:10px">今日目标 <b style="color:var(--green)">'+dailyTarget+'词</b> · 待背 <b style="color:var(--orange)">'+words.length+'词</b>'+(hwCount>0?' · <b style="color:var(--orange)">★'+hwCount+'</b> 高频回顾':'')+'</div>'+
    '<button class="btn btn-g btn-blk" style="margin:0 16px 14px" onclick="startStudy()">🚀 开始背诵</button>'+
    '</div>';
}

function startStudy(){ if(fcWords.length===0){ toast('今天没有要背的词了');return; } showFC(); }

function showFC(){
  if(fcIdx>=fcWords.length){
    var p=load(); if(p.ld!==today()){ p.days=(p.days||0)+1;p.ld=today();save(p); }
    document.getElementById('mainContent').innerHTML='<div class="empty"><div class="num">🎉</div><h3>本轮完成</h3><p>今天背了'+fcWords.length+'个词 · 连续第'+(p.days||0)+'天</p><button class="btn btn-g btn-blk" style="max-width:200px;margin:12px auto" onclick="switchTab(\'levels\')">去闯关测试</button><button class="btn btn-w btn-blk" style="max-width:200px;margin:8px auto" onclick="switchTab(\'study\')">回主页</button></div>';
    return;
  }
  var w=fcWords[fcIdx];flipped=false;
  document.getElementById('mainContent').innerHTML=
    '<div style="padding:8px 16px"><div style="font-size:13px;color:var(--gray);text-align:center;margin-bottom:10px;font-weight:500">'+ (fcIdx+1)+' / '+fcWords.length+'</div>'+
    '<div class="flashcard" id="fc" onclick="flip()">'+
    '<span class="tag '+(w.isNew?'tag-new':'tag-rev')+'">'+(w.isNew?'新词':'复习')+(w.isH?' ★':'')+'</span>'+
    '<div class="w">'+w.w+(w.isH?' <span class="star">★</span>':'')+'</div>'+
    '<div class="m" id="fcm" style="display:none">'+w.m+'</div>'+
    '<div class="hint" id="fch">点击卡片查看释义</div></div>'+
    '<div id="fca" style="display:none;display:flex;gap:10px;padding:0 16px;margin-top:14px">'+
    '<button class="btn btn-w btn-blk" onclick="mark(false)">还不认识</button>'+
    '<button class="btn btn-g btn-blk" onclick="mark(true)">已经认识</button></div></div>';
  window.scrollTo(0,0);
}

function flip(){ if(flipped)return;flipped=true;document.getElementById('fcm').style.display='block';document.getElementById('fch').style.display='none';document.getElementById('fca').style.display='flex'; }

function mark(ok){
  var w=fcWords[fcIdx],p=load(),k=w.w,ws=p[k]||{s:false,c:0,w:0,rnd:0,nr:''};
  ws.s=true;
  if(ok){ ws.c++;p.tc=(p.tc||0)+1;ws.rnd=Math.min(ws.rnd+1,EBB.length);
    if(ws.rnd<EBB.length){ var d=new Date();d.setDate(d.getDate()+EBB[ws.rnd]);ws.nr=d.toISOString().slice(0,10); } else ws.nr='2099-01-01';
  }else{ ws.w++;p.tw=(p.tw||0)+1;ws.rnd=0;var d=new Date();d.setDate(d.getDate()+1);ws.nr=d.toISOString().slice(0,10); }
  p[k]=ws;save(p);fcIdx++;showFC();
}

// ====== TAB2: 闯关 ======
function renderLevels(c,p){
  var done=(p.done||[]).length;
  var highDone=0; for(var i=0;i<10;i++){ var lv=LEVELS[i]; for(var j=0;j<(p.done||[]).length;j++){ if(p.done[j].id===lv.id&&p.done[j].stars>=2){ highDone++;break; } } }
  var fullDone=0; for(var i=10;i<30;i++){ var lv=LEVELS[i]; for(var j=0;j<(p.done||[]).length;j++){ if(p.done[j].id===lv.id&&p.done[j].stars>=2){ fullDone++;break; } } }

  var h='<div class="phase-card"><div class="ph-top"><div class="ph-icon" style="background:#FFF0E8">🔥</div><div class="ph-info"><div class="ph-name">高频速通</div><div class="ph-sub">Level 1-10 · 971核心词 · 100词/天 · 10天</div></div><div class="ph-count" style="color:var(--orange)">'+highDone+'<span style="font-size:14px;color:var(--gray)">/10</span></div></div><div class="phase-bar"><div class="phase-bar-fill" style="background:var(--orange);width:'+(highDone*10)+'%"></div></div><div class="level-grid">';
  for(var i=0;i<10;i++){ var lv=LEVELS[i],isDone=false,stars=0;
    for(var j=0;j<(p.done||[]).length;j++){ if(p.done[j].id===lv.id){ isDone=true;stars=p.done[j].stars;break; } }
    var cls = isDone?'done':(i===highDone?'today':(i>highDone?'locked':'done'));
    h+='<div class="level-dot '+cls+'"'+(cls!=='locked'?' onclick="startQuiz('+lv.id+')"':'')+'>Lv'+(i+1)+'<br>'+(isDone?'⭐'+stars:cls==='today'?'GO':'-')+'</div>';
  }
  h+='</div></div>';

  h+='<div class="phase-card"><div class="ph-top"><div class="ph-icon" style="background:#E8F0FF">📚</div><div class="ph-info"><div class="ph-name">正式背诵</div><div class="ph-sub">Level 11-30 · 2975词 · 150词/天 · '+(highDone>=10?'已解锁':'高频通关后解锁')+'</div></div><div class="ph-count" style="color:var(--blue)">'+fullDone+'<span style="font-size:14px;color:var(--gray)">/20</span></div></div><div class="phase-bar"><div class="phase-bar-fill" style="background:var(--blue);width:'+(fullDone*5)+'%"></div></div>';
  if(highDone>=10){
    h+='<div class="level-grid">';
    for(var i=10;i<30;i++){ var lv=LEVELS[i],isDone=false,stars=0;
      for(var j=0;j<(p.done||[]).length;j++){ if(p.done[j].id===lv.id){ isDone=true;stars=p.done[j].stars;break; } }
      var unlocked=i===10; for(var j=0;j<(p.done||[]).length;j++){ if(p.done[j].id===i&&p.done[j].stars>=2)unlocked=true; }
      var cls=isDone?'done':(!unlocked?'locked':'');
      h+='<div class="level-dot '+cls+'"'+(cls!=='locked'?' onclick="startQuiz('+lv.id+')"':'')+'>Lv'+(i+1)+'<br>'+(isDone?'⭐'+stars:'-')+'</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  c.innerHTML=h;
}

function startQuiz(id){
  var lv=null;for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].id===id)lv=LEVELS[i];
  if(!lv)return;
  var ws=lv.words.slice().sort(function(){return Math.random()-.5});
  qzWords=ws.slice(0,Math.min(20,ws.length));qzIdx=0;qzScore=0;
  showQuiz();
}

function showQuiz(){
  if(qzIdx>=qzWords.length){ finishQuiz();return; }
  var w=qzWords[qzIdx],all=[];
  for(var i=0;i<LEVELS.length;i++)all=all.concat(LEVELS[i].words);
  var wrong=all.filter(function(x){return x.w!==w.w;}).sort(function(){return Math.random()-.5}).slice(0,3).map(function(x){return x.m;});
  var opts=wrong.concat([w.m]).sort(function(){return Math.random()-.5});
  var ci=opts.indexOf(w.m);
  document.getElementById('mainContent').innerHTML=
    '<div style="text-align:center;padding:18px 16px 0"><div style="font-size:14px;font-weight:700;color:var(--text)">Level '+qzWords[0].lid+' 闯关测试</div><div style="font-size:13px;color:var(--gray);margin-top:4px">'+(qzIdx+1)+'/'+qzWords.length+' · '+qzScore+'分</div><div style="height:4px;background:var(--light);border-radius:2px;margin:14px 0;overflow:hidden"><div style="height:100%;background:var(--green);width:'+(qzIdx/qzWords.length*100)+'%;transition:width .3s"></div></div></div>'+
    '<div class="quiz-word">'+w.w+(isHigh(w.w)?' <span style="color:var(--orange);font-size:24px">★</span>':'')+'</div>'+
    '<div class="quiz-options" id="qzOpts">'+opts.map(function(o,i){return '<div class="quiz-opt" data-ci="'+(i===ci)+'" onclick="answerQuiz(this)">'+o+'</div>';}).join('')+'</div>'+
    '<div style="text-align:center;margin-top:18px"><button class="btn btn-w" onclick="switchTab(\'levels\')">退出</button></div>';
}

function answerQuiz(el){
  var ok=el.dataset.ci==='true',opts=document.querySelectorAll('#qzOpts .quiz-opt');
  for(var i=0;i<opts.length;i++)opts[i].style.pointerEvents='none';
  if(ok){ el.classList.add('correct');qzScore++; } else{ el.classList.add('wrong');for(var i=0;i<opts.length;i++)if(opts[i].dataset.ci==='true')opts[i].classList.add('correct'); }
  setTimeout(function(){ qzIdx++;showQuiz(); },650);
}

function finishQuiz(){
  var pct=Math.round(qzScore/qzWords.length*100),stars=pct>=95?3:pct>=80?2:pct>=60?1:0,passed=stars>=2;
  var p=load(),lvId=qzWords[0].lid,ex=null;
  for(var i=0;i<(p.done||[]).length;i++)if(p.done[i].id===lvId)ex=p.done[i];
  if(!ex||stars>ex.stars){ if(ex){ ex.stars=stars;ex.date=today(); } else{ p.done=(p.done||[]);p.done.push({id:lvId,stars:stars,date:today()}); } save(p); }
  document.getElementById('mainContent').innerHTML=
    '<div class="empty"><div class="num">'+(passed?'🎉':'💪')+'</div><h3>'+(passed?'通关成功！':'继续加油')+'</h3>'+
    '<p style="font-size:15px;margin:4px 0">正确率 '+pct+'% · '+qzScore+'/'+qzWords.length+'</p>'+
    '<div style="font-size:36px;margin:8px 0">'+'⭐'.repeat(stars)+'☆'.repeat(3-stars)+'</div>'+
    (passed&&lvId<30?'<button class="btn btn-g btn-blk" style="max-width:200px;margin:8px auto" onclick="startQuiz('+(lvId+1)+')">下一关 →</button>':'')+
    (stars<2?'<button class="btn btn-o btn-blk" style="max-width:200px;margin:8px auto" onclick="startQuiz('+lvId+')">重新挑战</button>':'')+
    '<button class="btn btn-w btn-blk" style="max-width:200px;margin:8px auto" onclick="switchTab(\'levels\')">返回闯关</button>'+
    (passed?'<button class="btn btn-b btn-blk" style="max-width:200px;margin:8px auto" onclick="shareResult('+lvId+','+pct+','+stars+')">📤 分享给教务老师</button>':'')+'</div>';
}

function shareResult(lvId,pct,stars){
  var p=load(),seen=Object.keys(p).filter(function(k){return p[k]&&p[k].s;}).length;
  var txt='【高考词汇速通关】\\n\\n通关 Level '+lvId+'！\\n正确率：'+pct+'% '+'⭐'.repeat(stars)+'\\n累计已学：'+seen+'/'+TOTAL+'词\\n连续学习：'+(p.days||0)+'天\\n\\n—— 学囤囤 · '+today();
  if(navigator.share){ navigator.share({title:'闯关成绩单',text:txt}); }
  else{
    var ov=document.createElement('div');ov.className='modal-overlay';
    ov.innerHTML='<div class="modal-box"><h3>🏆 闯关成绩单</h3><div class="score">'+pct+'%</div><div style="font-size:28px">'+'⭐'.repeat(stars)+'</div><div class="share-text">'+txt.replace(/\\n/g,'<br>')+'</div><button class="btn btn-g btn-blk" onclick="navigator.clipboard.writeText(this.parentElement.querySelector(\'.share-text\').textContent).then(function(){alert(\'已复制，发给教务老师吧！\')})">📋 一键复制发送</button></div>';
    document.body.appendChild(ov);ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  }
}

// ====== TAB3: 短文 ======
var PASSAGES = [
  {t:"A Fresh Start",tag:"校园生活",txt:"Every September, students enter a new stage. They leave familiar environments and embrace the challenge. Lily woke early, eager to begin. She had prepared everything — her schedule, notebooks, and ambition. The atmosphere was completely different. Her teacher delivered a speech that impressed everyone. 'Your potential is beyond what you imagine,' he said. 'Success requires effort. Develop good habits, manage time wisely, and never quit.' Lily realized that growth comes from participating in various activities. Every individual has their own path."},
  {t:"The Power of Technology",tag:"科技未来",txt:"Technology has transformed every aspect of modern life. From artificial intelligence to global networks, the pace of change is beyond prediction. These devices process enormous amounts of data, making decisions that affect our safety and convenience. However, experts argue we must consider the consequences. Social media platforms connect people yet also spread misinformation. The challenge is to use technology as a tool rather than letting it control our lives."},
  {t:"Guardians of the Earth",tag:"环境保护",txt:"Our planet faces an unprecedented crisis. Climate change, pollution, and biodiversity loss threaten the delicate balance of nature. Scientists warn that immediate action is required. Every year, plastic waste harms marine life. Forests are destroyed at an alarming rate. But individuals and organizations are taking responsibility. Young activists demand policy changes. Companies invest in renewable energy. The choices you make every day have an impact."},
  {t:"The Winning Mindset",tag:"健康运动",txt:"Every athlete knows that physical strength alone cannot achieve greatness. Mental toughness and the ability to overcome obstacles separate champions from the rest. Tom lacked natural talent but made up for it with determination. He practiced daily and analyzed his performance. In the crucial championship, his team was behind. But he delivered a speech that changed everything. True victory is the courage to continue when things seem hopeless."},
  {t:"Bridging Cultures",tag:"文化交流",txt:"Lisa had an extraordinary opportunity to participate in an international exchange program. At first, everything seemed different — the food, the accent, the social situations. Gradually, she made friends from various countries. Each conversation was a window into a different culture. She realized that cultural differences are not barriers but bridges. The world is a book, and those who do not travel read only one page."},
  {t:"Roots and Wings",tag:"家庭成长",txt:"Family shapes our character and provides the foundation for our future. During adolescence, conflicts seem inevitable. Teenagers desire independence while parents want to protect. But beneath surface disagreements lie deeper concerns about trust and communication. Parents make mistakes too. Their intentions are rooted in love. Give children roots to know where they come from, and wings to fly wherever they choose."},
  {t:"Learning How to Learn",tag:"学习方法",txt:"Kevin believed intelligence was fixed. This belief was a convenient excuse. Then he encountered the concept of growth mindset. The brain is like a muscle — it grows stronger with use. He began to actively engage with material, using techniques like spaced repetition. The results were remarkable. His grades improved significantly. Intelligence can be developed through effective strategies and persistence."},
  {t:"Rising After the Fall",tag:"励志成功",txt:"Failure is the most underrated teacher. Society celebrates success and hides failure, creating the illusion that successful people achieved goals without struggle. J.K. Rowling was rejected by twelve publishers before someone took a chance. What distinguishes those who succeed is resilience — the ability to recover from setbacks. Every failure contains a lesson. Failing at something does not make you a failure."},
  {t:"Digital Lives",tag:"网络时代",txt:"The internet has fundamentally altered how we connect. Teenagers access information instantly and communicate through various channels. Yet constant connection has a cost. Studies reveal that excessive screen time is linked to increased anxiety and depression. The pressure to maintain a perfect online image can be exhausting. The challenge is to develop a healthy relationship with technology."},
  {t:"Dreams Take Flight",tag:"梦想未来",txt:"Every great achievement began as a dream. The ability to imagine a future that does not yet exist — and work tirelessly to make it real — is remarkable. What is your dream? It does not have to be extraordinary. Whatever your dream, it is worth pursuing. The path is longer than we expect, with obstacles and doubts. But what sustains us is purpose. Dream boldly. Plan carefully. Work patiently."}
];

function renderPassages(c,p){
  var h='<div style="padding:18px 16px 0"><div style="font-size:22px;font-weight:800;margin-bottom:2px">📖 语境短文</div><div style="font-size:13px;color:var(--gray);margin-bottom:10px">在阅读中巩固高频词 · 共10篇</div></div>';
  for(var i=0;i<PASSAGES.length;i++){
    var ps=PASSAGES[i];
    h+='<div class="passage-card" onclick="openPassage('+i+')"><div class="ps-title">'+(i+1)+'. '+ps.t+'</div><div class="ps-tag">'+ps.tag+'</div><div class="passage-preview">'+ps.txt.slice(0,120)+'...</div></div>';
  }
  c.innerHTML=h;
}

function openPassage(idx){
  var ps=PASSAGES[idx];
  var p=load();
  // 标记高频词
  var rendered=ps.txt.replace(/\b([a-zA-Z]+)\b/g,function(m){
    return isHigh(m)?'<span class="pw-high">'+m+'</span>':m;
  });
  document.getElementById('mainContent').innerHTML=
    '<div style="padding:18px 16px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><button class="btn btn-w" style="padding:8px 16px;font-size:13px" onclick="switchTab(\'passages\')">← 返回</button><span style="font-size:12px;color:var(--gray);font-weight:500">'+ps.tag+'</span></div>'+
    '<div style="font-size:22px;font-weight:800;margin-bottom:4px">'+ps.t+'</div>'+
    '<div class="full-passage">'+rendered+'</div>'+
    '<div style="margin-top:16px;padding:12px;background:#E8FAEF;border-radius:12px;font-size:12px;color:var(--greenD)">💡 绿色高亮 = 高频核心词，在上下文中理解记忆效果更好</div></div>';
}

// ====== TAB4: 复习 ======
function renderReview(c,p){
  var ts=today(),words=[];
  for(var i=0;i<LEVELS.length;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){ var w=lv.words[j],ws=p[w.w];if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')words.push({w:w.w,m:w.m,lid:lv.id,name:lv.name}); }
  }
  if(!words.length){ c.innerHTML='<div class="empty"><div class="num">✅</div><h3>没有待复习的词</h3><p>艾宾浩斯复习计划正常进行中</p></div>';return; }
  var grp={};
  for(var i=0;i<words.length;i++){ var rw=words[i];if(!grp[rw.lid])grp[rw.lid]={name:rw.name,words:[]};grp[rw.lid].words.push(rw); }
  var h='<div style="padding:18px 16px 0"><div style="font-size:22px;font-weight:800;margin-bottom:2px">📊 复习提醒</div><div style="font-size:13px;color:var(--gray);margin-bottom:10px">艾宾浩斯遗忘曲线 · 今日待复习 <b style="color:var(--red)">'+words.length+'</b> 词</div></div>';
  var keys=Object.keys(grp);
  for(var i=0;i<keys.length;i++){ var g=grp[keys[i]];
    h+='<div class="review-item" onclick="reviewLevel('+keys[i]+')"><div class="ri-left"><div class="ri-icon" style="background:#FFF0F0">📝</div><div><div class="ri-title">'+g.name+'</div><div class="ri-sub">'+g.words.length+'个词待复习</div></div></div><div class="ri-badge">去复习</div></div>';
  }
  c.innerHTML=h;
}

function reviewLevel(id){
  var p=load(),ts=today(),lv=null;
  for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].id===id)lv=LEVELS[i];
  if(!lv)return;
  fcWords=[];for(var i=0;i<lv.words.length;i++){ var w=lv.words[i],ws=p[w.w];if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')fcWords.push({w:w.w,m:w.m,lid:lv.id,isRev:true,rnd:ws.rnd||0,isH:isHigh(w.w)}); }
  fcIdx=0;flipped=false;switchTab('study');showFC();
}

}
