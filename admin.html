<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>学囤囤 · 教务管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC',-apple-system,sans-serif;background:#F5F7FA;color:#333;max-width:600px;margin:0 auto;padding:16px}
h1{font-size:20px;color:#2C3E6B;margin-bottom:4px}
.sub{font-size:13px;color:#999;margin-bottom:20px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{font-size:16px;color:#2C3E6B;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #eee}
th{color:#999;font-weight:600;font-size:11px}
.badge{padding:3px 8px;border-radius:10px;font-size:11px}
.badge-free{background:#E8F8F0;color:#27AE60}
.badge-used{background:#FFF3E0;color:#E8734A}
.btn{padding:10px 20px;border-radius:20px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary{background:#2C3E6B;color:#fff}
.btn-orange{background:#E8734A;color:#fff}
.btn-outline{background:transparent;border:2px solid #2C3E6B;color:#2C3E6B}
.btn-sm{padding:6px 14px;font-size:12px}
input{padding:10px 14px;border-radius:10px;border:2px solid #E8ECF1;font-size:14px;width:100%}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.status-bar{display:flex;gap:16px;margin-bottom:16px}
.stat{flex:1;background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat .num{font-size:24px;font-weight:700;color:#2C3E6B}
.stat .label{font-size:11px;color:#999}
.hidden{display:none}
#loginScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:#2C3E6B;display:flex;align-items:center;justify-content:center;z-index:999}
#loginBox{background:#fff;border-radius:16px;padding:30px;width:90%;max-width:360px;text-align:center}
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginScreen">
  <div id="loginBox">
    <h2 style="margin-bottom:16px">🔐 教务管理登录</h2>
    <input id="adminPwd" type="password" placeholder="请输入管理密码" style="text-align:center;font-size:16px">
    <div id="loginError" style="color:#E74C3C;font-size:13px;margin-top:8px;min-height:20px"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="login()">进入管理后台</button>
    <p style="font-size:11px;color:#999;margin-top:12px">默认密码: xdd2026（请及时修改）</p>
  </div>
</div>

<!-- 主面板（默认隐藏） -->
<div id="mainPanel" class="hidden">
  <h1>📋 学囤囤 · 教务管理后台</h1>
  <div class="sub">邀请码管理 · 学员追踪 · 数据概览</div>

  <div class="status-bar">
    <div class="stat"><div class="num" id="totalCodes">200</div><div class="label">总邀请码</div></div>
    <div class="stat"><div class="num" id="usedCodes">0</div><div class="label">已发放</div></div>
    <div class="stat"><div class="num" id="activeStudents">0</div><div class="label">已激活学员</div></div>
  </div>

  <div class="card">
    <h2>📤 发放新邀请码</h2>
    <div class="row">
      <input id="studentName" placeholder="学员姓名（选填）">
      <button class="btn btn-orange btn-sm" onclick="assignCode()" style="white-space:nowrap">发放 →</button>
    </div>
    <div id="assignResult" style="margin-top:8px;font-size:14px;font-weight:600;color:#27AE60"></div>
  </div>

  <div class="card">
    <h2>📊 邀请码使用记录</h2>
    <div style="max-height:400px;overflow-y:auto">
      <table id="codeTable">
        <thead><tr><th>邀请码</th><th>学员</th><th>发放时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="codeTableBody"></tbody>
      </table>
    </div>
    <div id="emptyMsg" style="text-align:center;padding:30px;color:#999">暂无记录。发放邀请码后这里会显示。</div>
  </div>

  <div class="card">
    <h2>🔧 设置</h2>
    <button class="btn btn-outline btn-sm" onclick="exportData()">📥 导出数据 (CSV)</button>
    <button class="btn btn-outline btn-sm" onclick="changePassword()" style="margin-left:8px">🔑 修改管理密码</button>
    <button class="btn btn-outline btn-sm" onclick="resetAll()" style="margin-left:8px;color:#E74C3C;border-color:#E74C3C">⚠️ 重置</button>
  </div>
</div>

<script>
var ADMIN_CODES = ['XDD-W8Z1-O4A3', 'XDD-5QUW-GIVV', 'XDD-NRSG-5GFP', 'XDD-V79M-ASTM', 'XDD-NPRF-YE1B', 'XDD-MQXZ-FLHA', 'XDD-NUAX-KGB7', 'XDD-P4NG-W8YT', 'XDD-B92O-PT31', 'XDD-8J1R-P2YD', 'XDD-EP0X-UPF4', 'XDD-3IRE-K8R7', 'XDD-5KTH-PLF6', 'XDD-Z3VJ-J1X3', 'XDD-VSHC-IJYY', 'XDD-5F7P-G75T', 'XDD-7DX9-O0RG', 'XDD-S4XU-HY93', 'XDD-DT7I-IC9T', 'XDD-4VML-S7OP', 'XDD-5ZAQ-Q151', 'XDD-1N5W-RXK1', 'XDD-6C7T-CFNF', 'XDD-XATG-0ON3', 'XDD-92LS-851U', 'XDD-2PSV-QP10', 'XDD-AQ51-MGIW', 'XDD-2G6G-3QCF', 'XDD-7REG-D7PV', 'XDD-4DRO-F6JD', 'XDD-UMRA-V8IE', 'XDD-SS3I-7K62', 'XDD-1EPN-SYBH', 'XDD-J6GS-F2QH', 'XDD-19M1-VR6L', 'XDD-RXP2-IPPC', 'XDD-I2TY-CZUI', 'XDD-XCAO-QXSQ', 'XDD-INF7-L6JU', 'XDD-UJEV-0OGB', 'XDD-26VO-QAMF', 'XDD-NYLQ-Z6R5', 'XDD-MDJY-DI0I', 'XDD-9OAF-WTZO', 'XDD-ZVHZ-GZEW', 'XDD-JG19-8HD7', 'XDD-ZAFN-FYLL', 'XDD-UYKI-U2M6', 'XDD-NWU5-E100', 'XDD-A8VI-APNR', 'XDD-103L-UF0Q', 'XDD-XUW1-9C7D', 'XDD-U7EU-VPLP', 'XDD-R0OZ-G6SD', 'XDD-WZVD-QDUA', 'XDD-66O8-XNNX', 'XDD-QG2S-579T', 'XDD-IL21-SSAC', 'XDD-7G6X-QP3S', 'XDD-FY0V-F3RR', 'XDD-W3M4-ZMTD', 'XDD-QVAZ-K4FU', 'XDD-PA06-E9L5', 'XDD-ETBG-NDG2', 'XDD-TRNC-JK7T', 'XDD-O3X3-SSGG', 'XDD-4VYG-9X5Z', 'XDD-4UXB-QRGA', 'XDD-1JIS-IA89', 'XDD-KF91-BN3W', 'XDD-HTPG-426D', 'XDD-WKXZ-JUJ7', 'XDD-BWX4-4YN8', 'XDD-3EQD-X3O1', 'XDD-Y9PU-BJC9', 'XDD-2663-YXLB', 'XDD-N9FH-BBH7', 'XDD-OQQK-VPND', 'XDD-QDOS-ERVS', 'XDD-8B31-ZK63', 'XDD-9TQ0-U9JI', 'XDD-UHHF-1R41', 'XDD-TOUW-SOB6', 'XDD-BB40-6DG6', 'XDD-1TGR-2D6B', 'XDD-TTSQ-EHN0', 'XDD-MU3N-T0M1', 'XDD-31K8-9VBF', 'XDD-LBDO-01BY', 'XDD-Q678-ITAZ', 'XDD-9I9F-NS51', 'XDD-Q21K-BUSV', 'XDD-GZHS-1CQP', 'XDD-O1YK-DEAD', 'XDD-L8SN-GTBT', 'XDD-EAPY-L9KE', 'XDD-KXU4-0QBI', 'XDD-5AY7-IJ5L', 'XDD-L5RP-T15T', 'XDD-PGVY-3WTJ', 'XDD-XF89-G6WV', 'XDD-R5GA-SLFH', 'XDD-Z7IS-E60Y', 'XDD-P92F-4KXS', 'XDD-VRNN-GK15', 'XDD-D09I-V4H9', 'XDD-U53Y-R7CC', 'XDD-Y41D-YXL9', 'XDD-SKXM-CARR', 'XDD-2IW7-P8NU', 'XDD-43A9-TLTW', 'XDD-SU1F-XOKF', 'XDD-NR12-U2U8', 'XDD-SMMT-4O7M', 'XDD-BBP9-AEWF', 'XDD-N8IU-SKYG', 'XDD-GBIK-MQ0I', 'XDD-0CJE-CTKH', 'XDD-II35-5YSY', 'XDD-DVCR-6A7B', 'XDD-D4C2-XXR6', 'XDD-52D9-TX9P', 'XDD-7EY1-QIZP', 'XDD-R157-CUWY', 'XDD-E7XF-OVAU', 'XDD-N818-WMNO', 'XDD-RK9H-BU5E', 'XDD-PX2W-XQYE', 'XDD-X93Q-SG18', 'XDD-CLS9-I4OF', 'XDD-UZZY-8F90', 'XDD-FQHE-5RHK', 'XDD-QUL0-3TN7', 'XDD-2XA6-5MRY', 'XDD-YGTN-N9C5', 'XDD-O5RZ-58NT', 'XDD-5UQG-2OA1', 'XDD-D1QN-YQYP', 'XDD-74A3-TA93', 'XDD-RR8O-UMAB', 'XDD-VHWG-EXO6', 'XDD-F914-BGA7', 'XDD-AT3Z-HFSS', 'XDD-U10N-1A92', 'XDD-XIL9-H8T6', 'XDD-XC54-7ZBY', 'XDD-9IN1-6HR9', 'XDD-HOUH-KPYB', 'XDD-G6NQ-LYUG', 'XDD-YUP8-IC51', 'XDD-37B6-7QW5', 'XDD-11AR-DCZD', 'XDD-5N6P-3ULH', 'XDD-DLHA-2CO4', 'XDD-AH3N-JLM8', 'XDD-Y0UG-5Y9Q', 'XDD-ZG84-TQ6G', 'XDD-G8OH-DYSJ', 'XDD-0FL4-PONH', 'XDD-KOO9-XQ5V', 'XDD-047H-ADVM', 'XDD-D6AN-QN4S', 'XDD-MHTR-4T8O', 'XDD-FFDM-VBPE', 'XDD-OJOW-GW1B', 'XDD-I9U7-GIBL', 'XDD-RPHE-F4MX', 'XDD-LCX8-4Q54', 'XDD-GBRC-C7IK', 'XDD-6OAC-FYIX', 'XDD-R0JX-J0QI', 'XDD-GSXH-2UWL', 'XDD-EX3H-YZ9X', 'XDD-FI1W-ZI97', 'XDD-29AL-597E', 'XDD-SIH2-ROSV', 'XDD-TEBR-V5NK', 'XDD-T54A-5IGD', 'XDD-5MO9-1X69', 'XDD-RO7L-LZ88', 'XDD-WEOH-5HAU', 'XDD-4ZHV-7350', 'XDD-ZR90-6O6S', 'XDD-P2EP-FSBC', 'XDD-ZRXG-TM5J', 'XDD-3FO7-F5QN', 'XDD-UOXH-DNJ1', 'XDD-W6W1-KGI3', 'XDD-57XF-EZLN', 'XDD-PA4Z-2PBM', 'XDD-A1MB-D9E0', 'XDD-QAEV-W97R', 'XDD-UYS8-JI5G', 'XDD-7O13-WVW7', 'XDD-7QD9-MFE0', 'XDD-Z2V3-BWJR', 'XDD-DQDM-ZDPK', 'XDD-STRD-S2KS', 'XDD-71YS-2KJ1', 'XDD-QT35-XEV6'];

const ADMIN_KEY = 'xuedundun_admin';
const DEFAULT_PWD = 'xdd2026';

function login() {
  const pwd = document.getElementById('adminPwd').value.trim();
  const savedPwd = localStorage.getItem(ADMIN_KEY + '_pwd') || DEFAULT_PWD;
  if (pwd === savedPwd) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainPanel').classList.remove('hidden');
    loadData();
  } else {
    document.getElementById('loginError').textContent = '密码错误';
  }
}

// 回车登录
document.getElementById('adminPwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

function loadData() {
  const records = JSON.parse(localStorage.getItem(ADMIN_KEY + '_records') || '[]');
  const codes = JSON.parse(localStorage.getItem(ADMIN_KEY + '_codes') || '[]');

  // 初始化预生成码（首次使用）
  if (codes.length === 0) {
    // 直接使用内嵌的邀请码列表（无需外部文件）
    var initCodes = ADMIN_CODES;
    localStorage.setItem(ADMIN_KEY + '_codes', JSON.stringify(initCodes));
    loadData();
    return;
  }

  document.getElementById('totalCodes').textContent = codes.length;
  document.getElementById('usedCodes').textContent = records.length;
  document.getElementById('activeStudents').textContent = records.filter(r => r.status === '已激活').length;

  const tbody = document.getElementById('codeTableBody');
  const emptyMsg = document.getElementById('emptyMsg');

  if (records.length === 0) {
    tbody.innerHTML = '';
    emptyMsg.style.display = 'block';
  } else {
    emptyMsg.style.display = 'none';
    tbody.innerHTML = records.slice().reverse().map(r => `
      <tr>
        <td><code>${r.code}</code></td>
        <td>${r.student || '—'}</td>
        <td>${r.date || '—'}</td>
        <td><span class="badge ${r.status === '已激活' ? 'badge-free' : 'badge-used'}">${r.status || '已发放'}</span></td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="toggleStatus('${r.code}')">${r.status === '已激活' ? '标为未激活' : '标为已激活'}</button>
        </td>
      </tr>
    `).join('');
  }
}

function assignCode() {
  const codes = JSON.parse(localStorage.getItem(ADMIN_KEY + '_codes') || '[]');
  const records = JSON.parse(localStorage.getItem(ADMIN_KEY + '_records') || '[]');
  const usedCodes = new Set(records.map(r => r.code));
  const available = codes.filter(c => !usedCodes.has(c));

  if (available.length === 0) {
    document.getElementById('assignResult').textContent = '所有邀请码已发放完毕！请生成新码';
    document.getElementById('assignResult').style.color = '#E74C3C';
    return;
  }

  const code = available[0];
  const name = document.getElementById('studentName').value.trim() || '未记录';
  const today = new Date().toISOString().slice(0,10);

  records.push({ code, student: name, date: today, status: '已发放' });
  localStorage.setItem(ADMIN_KEY + '_records', JSON.stringify(records));

  document.getElementById('assignResult').innerHTML = `✅ 邀请码: <strong>${code}</strong><br>学员: ${name}<br><small style="color:#999">请将此码发给学员，在App中输入激活</small>`;
  document.getElementById('assignResult').style.color = '#27AE60';
  document.getElementById('studentName').value = '';
  loadData();
}

function toggleStatus(code) {
  const records = JSON.parse(localStorage.getItem(ADMIN_KEY + '_records') || '[]');
  const r = records.find(r => r.code === code);
  if (r) r.status = r.status === '已激活' ? '已发放' : '已激活';
  localStorage.setItem(ADMIN_KEY + '_records', JSON.stringify(records));
  loadData();
}

function exportData() {
  const records = JSON.parse(localStorage.getItem(ADMIN_KEY + '_records') || '[]');
  let csv = '邀请码,学员姓名,发放日期,状态\n';
  records.forEach(r => csv += `${r.code},${r.student},${r.date},${r.status}\n`);
  const blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = '邀请码记录.csv'; a.click();
}

function changePassword() {
  const newPwd = prompt('请输入新管理密码（至少6位）：');
  if (newPwd && newPwd.length >= 6) {
    localStorage.setItem(ADMIN_KEY + '_pwd', newPwd);
    alert('密码已修改！请牢记新密码: ' + newPwd);
  } else if (newPwd) {
    alert('密码至少6位！');
  }
}

function resetAll() {
  if (confirm('确定要重置所有数据吗？\n\n这将清除：\n- 邀请码使用记录\n- 管理密码重置为默认\n\n此操作不可恢复！')) {
    localStorage.removeItem(ADMIN_KEY + '_records');
    localStorage.removeItem(ADMIN_KEY + '_pwd');
    location.reload();
  }
}
</script>
</body>
</html>
