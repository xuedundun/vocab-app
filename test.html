<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>激活测试</title>
<style>
body{font-family:'PingFang SC',-apple-system,sans-serif;background:#2C3E6B;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.box{text-align:center;color:#fff;max-width:300px;width:100%}
input{width:100%;padding:14px;border-radius:12px;border:none;font-size:18px;text-align:center;letter-spacing:2px;font-family:monospace;margin-top:16px}
button{width:100%;padding:14px;border-radius:25px;background:#E8734A;color:#fff;border:none;font-size:17px;font-weight:600;margin-top:12px;cursor:pointer}
.err{color:#FF6B6B;font-size:13px;margin-top:8px;min-height:20px}
.msg{font-size:14px;margin-top:16px;padding:10px;background:rgba(255,255,255,.1);border-radius:8px}
</style>

<body>
<div class="box">
  <div style="font-size:48px">📚</div>
  <h2>激活测试页</h2>
  <p style="font-size:13px;opacity:.8">先试试这个页面按钮能不能点</p>
  <input id="code" type="text" placeholder="XDD-XXXX-XXXX" autocomplete="off" maxlength="14">
  <div class="err" id="err"></div>
  <button id="btn" onclick="test()">激活测试</button>
  <div class="msg" id="msg">等待输入...</div>
</div>

document.getElementById('msg').textContent = 'JS OK, Hash数:' + HASHES.length;

function test(){
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');
  var msg = document.getElementById('msg');
  var code = document.getElementById('code').value.trim().toUpperCase();
  
  btn.textContent = '测试中...';
  btn.disabled = true;
  err.textContent = '';
  msg.textContent = '输入: ' + code;
  
  setTimeout(function(){
    try {
      var h = sha256(SALT + code).slice(0,16);
      msg.textContent = 'Hash: ' + h + ' | 匹配: ' + (HASHES.indexOf(h) >= 0);
      if (HASHES.indexOf(h) >= 0) {
        err.textContent = '✅ 验证通过！';
        btn.textContent = '成功！';
      } else {
        err.textContent = '❌ 无效';
        btn.textContent = '激活测试';
        btn.disabled = false;
      }
    } catch(e) {
      msg.textContent = '错误: ' + e.message;
      btn.textContent = '激活测试';
      btn.disabled = false;
    }
  }, 100);
}

document.getElementById('code').addEventListener('input', function(){
  var v = this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  if(v.length>8)v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
  else if(v.length>4)v=v.slice(0,3)+'-'+v.slice(4,8);
  this.value=v.slice(0,14);
});
</script>
