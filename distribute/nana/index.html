<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#C83C3C">
<meta property="og:title" content="今年，我们计划深度带1000名学生逆袭 | NANA学姐">
<meta property="og:description" content="针对性学习计划 + 教务全程监督 + 清北答疑 + 全科课程。一站式高考备考方案，让你不用操心学什么、怎么学。">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>NANA学姐 · 添加教务老师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#F8F6F4;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:#fff;border-radius:24px;padding:32px 24px;text-align:center;max-width:340px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.logo{width:48px;height:48px;background:#C83C3C;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:900;margin:0 auto 12px}
h2{font-size:20px;font-weight:800;color:#2C2C2C;margin:8px 0}
.sub{font-size:13px;color:#8E8B86;margin-bottom:24px}
.qr-box{width:200px;height:200px;margin:0 auto 16px;border-radius:16px;overflow:hidden;border:2px solid #F0EDE8}
.qr-box img{width:100%;height:100%;object-fit:contain}
.teacher-name{font-size:18px;font-weight:700;color:#2C2C2C;margin-bottom:4px}
.teacher-label{font-size:13px;color:#C83C3C;font-weight:600;margin-bottom:20px;background:#F8F0F0;display:inline-block;padding:4px 14px;border-radius:12px}
.guide{font-size:12px;color:#8E8B86;line-height:1.6}
.guide b{color:#C83C3C}
.footer{font-size:11px;color:#C0BDB8;margin-top:20px}
</style>
</head>
<body>
<div class="card">
  <img src="photo.jpg" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #C83C3C;margin-bottom:12px" alt="NANA学姐">
  <h2 style="font-size:16px;line-height:1.6;font-weight:800">今年，我们计划<br>深度带 <b style="color:#C83C3C">1000 名学生</b> 逆袭</h2>

  <div style="background:#FAF7F4;border-radius:12px;padding:14px;margin:16px 0;text-align:left">
    <div style="font-size:14px;font-weight:700;color:#2C2C2C;margin-bottom:6px">📋 一对一分析成绩</div>
    <div style="font-size:14px;font-weight:700;color:#2C2C2C">🎯 深度指导学习方法</div>
  </div>

  <div class="qr-box"><img id="qrImg" src="" alt="微信二维码"></div>

  <div style="font-size:20px;font-weight:900;color:#C83C3C;margin:8px 0 4px;line-height:1.3">
    再也不操心<br>怎么学、学什么！
  </div>

  <button style="width:100%;padding:12px;border-radius:24px;background:#C83C3C;color:#fff;border:none;font-size:15px;font-weight:700;margin:8px 0 16px;pointer-events:none">长按识别二维码 → 加NANA学姐微信</button>

  <p class="guide" style="font-size:11px">长按上方二维码 → 选择<b>"识别图中二维码"</b><br>添加老师微信，获取专属提分方案</p>
  <p class="footer">NANA学姐 · 1000人逆袭计划</p>
</div>
<script>
var DEFAULT_8=[{id:'s1',name:'何良萍',qr:'https://xuedundun.github.io/vocab-app/distribute/sales/%E4%BD%95%E8%89%AF%E8%90%8D.jpg',dailyMax:9999,active:true},{id:'s2',name:'唐瑶',qr:'https://xuedundun.github.io/vocab-app/distribute/sales/%E5%94%90%E7%91%B6.jpg',dailyMax:9999,active:true},{id:'s3',name:'奉珈仪',qr:'https://xuedundun.github.io/vocab-app/distribute/sales/%E5%A5%89%E7%8F%88%E4%BB%AA.jpg',dailyMax:9999,active:true},{id:'s4',name:'曈曈',qr:'https://xuedundun.github.io/vocab-app/distribute/sales/%E6%9B%88%E6%9B%88.jpg',dailyMax:9999,active:true},{id:'s5',name:'锓锓',qr:'https://xuedundun.github.io/vocab-app/distribute/sales/%E9%94%93%E9%94%93.jpg',dailyMax:9999,active:true}];
var SHARED_SALES='nana_sales_pool',STORAGE_STATS='nana_sales_stats',STORAGE_ASSIGN='nana_assigned_teacher';
function getSales(){try{var d=JSON.parse(localStorage.getItem(SHARED_SALES));return (d&&d.length>0)?d:DEFAULT_8;}catch(e){return DEFAULT_8;}}
function getStats(){try{return JSON.parse(localStorage.getItem(STORAGE_STATS)||'{}');}catch(e){return{};}}
function today(){return new Date().toISOString().slice(0,10);}
function assignTeacher(){
  var sales=getSales(),stats=getStats(),ts=today();
  var assigned=localStorage.getItem(STORAGE_ASSIGN);
  if(assigned){var s=sales.find(function(x){return x.id===assigned;});if(s&&s.active)return s;}
  var available=sales.filter(function(s){return s.active;});
  if(available.length===0){
      document.getElementById('qrImg').style.display='none';
      document.querySelector('.qr-box').innerHTML='<div style="padding:40px;text-align:center;color:#8E8B86;font-size:14px">今日咨询人数已满<br>请明天再来<br><br>或直接联系你的教务老师</div>';
      return sales[0];
    }
  available.sort(function(a,b){return (stats[a.id+'_'+ts]||0)-(stats[b.id+'_'+ts]||0);});
  var chosen=available[0];
  localStorage.setItem(STORAGE_ASSIGN,chosen.id);
  var key=chosen.id+'_'+ts;stats[key]=(stats[key]||0)+1;
  localStorage.setItem(STORAGE_STATS,JSON.stringify(stats));
  return chosen;
}
var teacher=assignTeacher();
document.getElementById('qrImg').src=teacher.qr||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#F0EDE8"/><text x="100" y="90" text-anchor="middle" fill="#C0BDB8" font-size="14">请上传</text><text x="100" y="115" text-anchor="middle" fill="#C0BDB8" font-size="14">微信二维码</text></svg>');
</script>
</body>
</html>
