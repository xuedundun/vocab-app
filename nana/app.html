<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C83C3C">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>NANA学姐 · 高考词汇速通关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#C83C3C;--redD:#A62B2B;--bg:#F8F6F4;--card:#fff;--text:#2C2C2C;--sub:#8E8B86;--light:#EBE8E4;--gold:#C8963C;--radius:16px;--shadow:0 2px 16px rgba(0,0,0,.04)}
body{font-family:-apple-system,'PingFang SC','Noto Serif SC',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;position:relative;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.app{padding-bottom:90px;min-height:100vh}

/* Header */
.header{background:var(--bg);padding:16px 20px 12px;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--light)}
.header-inner{display:flex;align-items:center;justify-content:space-between;width:100%}
.header .brand{display:flex;align-items:center;gap:8px}
.header .brand-logo{width:30px;height:30px;background:var(--red);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900}
.header .brand-text{font-size:18px;font-weight:900;color:var(--text);letter-spacing:1px;font-family:'PingFang SC','Noto Serif SC','STSong',serif}
.header .streak{font-size:13px;color:var(--sub);font-weight:500;display:flex;align-items:center;gap:4px}
.header .streak b{color:var(--red);font-weight:700}

/* Bottom Nav */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);display:flex;border-top:1px solid var(--light);z-index:100;padding:6px 0 env(safe-area-inset-bottom,6px)}
.tab{flex:1;text-align:center;padding:10px 0 8px;font-size:13px;color:var(--sub);cursor:pointer;transition:.2s;font-weight:600;letter-spacing:1px}
.tab.active{color:var(--red);font-weight:800}
.tab .t-dot{width:4px;height:4px;border-radius:50%;background:transparent;margin:0 auto 5px;transition:.2s}
.tab.active .t-dot{background:var(--red);width:6px;height:6px}
.tab .badge{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:7px;position:absolute;margin-left:8px;margin-top:-20px;min-width:14px;text-align:center}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin:12px 16px;box-shadow:var(--shadow);border:1px solid var(--light)}

/* Buttons */
.btn{display:inline-block;padding:14px 28px;border-radius:24px;font-size:15px;font-weight:600;border:none;cursor:pointer;text-align:center;transition:all .15s;letter-spacing:.5px}
.btn-r{background:var(--red);color:#fff}
.btn-r:active{background:var(--redD);transform:scale(.97)}
.btn-w{background:var(--card);color:var(--text);border:1.5px solid var(--light)}
.btn-w:active{background:var(--bg);transform:scale(.97)}
.btn-blk{display:block;width:100%}
.btn:disabled{opacity:.4;pointer-events:none}

/* Progress */
.progress-ring{position:relative;width:140px;height:140px;margin:24px auto}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .bg{fill:none;stroke:var(--light);stroke-width:6}
.progress-ring .fg{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.progress-ring .txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.progress-ring .big{font-size:38px;font-weight:800;color:var(--red);line-height:1}
.progress-ring .sub{font-size:11px;color:var(--sub);margin-top:3px}

/* Flashcard */
.flashcard{background:var(--card);border-radius:20px;padding:44px 28px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;margin:12px 16px;transition:transform .2s;position:relative;border:1px solid var(--light)}
.flashcard:active{transform:scale(.98)}
.flashcard .w{font-size:40px;font-weight:800;color:var(--text);letter-spacing:.5px;text-align:center}
.flashcard .star-mark{color:var(--gold);font-size:26px;margin-left:6px;vertical-align:middle}
.flashcard .m{font-size:20px;color:var(--sub);margin-top:20px;text-align:center;line-height:1.5}
.flashcard .hint{font-size:13px;color:var(--sub);margin-top:16px;opacity:.6}
.flashcard .tag{position:absolute;top:16px;right:16px;font-size:11px;padding:4px 12px;border-radius:10px;font-weight:600;letter-spacing:.5px}
.tag-n{background:#F5F0EB;color:var(--gold)}
.tag-r{background:#F0E8E8;color:var(--red)}

/* Phase cards */
.phase-card{background:var(--card);border-radius:var(--radius);padding:18px;margin:12px 16px;box-shadow:var(--shadow);border:1px solid var(--light)}
.phase-card .ph-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.phase-card .ph-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.phase-card .ph-info{flex:1}
.phase-card .ph-name{font-size:15px;font-weight:700}
.phase-card .ph-sub{font-size:12px;color:var(--sub);margin-top:2px}
.phase-card .ph-count{font-size:32px;font-weight:800;color:var(--red)}
.phase-bar{height:4px;background:var(--light);border-radius:2px;overflow:hidden}
.phase-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.level-dot{text-align:center;padding:6px 2px;background:var(--bg);border-radius:10px;font-size:9px;font-weight:600;cursor:pointer;transition:.15s;color:var(--sub)}
.level-dot.done{background:#F0E8E8;color:var(--redD)}
.level-dot.today{background:var(--red);color:#fff}
.level-dot.locked{opacity:.2;pointer-events:none}

/* Quiz */
.quiz-word{font-size:36px;font-weight:800;text-align:center;padding:32px 16px;color:var(--text)}
.quiz-word .star-mark{color:var(--gold);font-size:22px;vertical-align:middle}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.quiz-opt{padding:18px 12px;background:var(--card);border:1.5px solid var(--light);border-radius:14px;font-size:14px;text-align:center;cursor:pointer;transition:.15s;font-weight:500}
.quiz-opt:active{background:var(--bg);transform:scale(.97)}
.quiz-opt.correct{border-color:var(--red);background:#F8F0F0}
.quiz-opt.wrong{border-color:#B0B0B0;background:#F5F5F5;opacity:.6}

/* Stats */
.stat-row{display:flex;gap:10px;padding:0 16px;margin-bottom:14px;width:100%;max-width:100%;box-sizing:border-box}
.stat-box{flex:1;background:var(--card);border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--light)}
.stat-box .num{font-size:30px;font-weight:800;color:var(--red)}
.stat-box .lbl{font-size:11px;color:var(--sub);margin-top:5px}

/* Passages */
.passage-card{background:var(--card);border-radius:var(--radius);padding:18px;margin:10px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;border:1px solid var(--light)}
.passage-card:active{transform:scale(.98)}
.passage-card .ps-num{font-size:11px;color:var(--red);font-weight:600;margin-bottom:4px}
.passage-card .ps-title{font-size:16px;font-weight:700;margin-bottom:4px}
.passage-card .ps-tag{font-size:11px;color:var(--sub)}
.pw-h{font-weight:700;color:var(--red);background:#F8F0F0;padding:1px 5px;border-radius:3px}
.full-passage{line-height:2;font-size:15px;padding:4px 0}
.full-trans{line-height:1.8;font-size:14px;color:var(--sub);padding:12px 0 0;border-top:1px solid var(--light);margin-top:12px}

/* Review */
.review-item{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--card);border-radius:var(--radius);margin:8px 16px;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--light)}
.review-item:active{background:var(--bg)}
.review-item .ri-left{display:flex;align-items:center;gap:12px}
.review-item .ri-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0}
.review-item .ri-title{font-size:15px;font-weight:600}
.review-item .ri-sub{font-size:12px;color:var(--sub);margin-top:1px}
.review-item .ri-badge{background:var(--red);color:#fff;font-size:11px;padding:4px 12px;border-radius:12px;white-space:nowrap;font-weight:600}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(44,44,44,.9);color:#fff;padding:12px 28px;border-radius:24px;font-size:14px;z-index:999;pointer-events:none;animation:ti .3s}
@keyframes ti{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* Loading */
#loadingBox{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#loadingBox .ld-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:ldPulse .8s infinite alternate}
@keyframes ldPulse{from{transform:scale(1);opacity:.4}to{transform:scale(2.5);opacity:1}}
#loadingBox p{margin-top:16px;color:var(--sub);font-size:14px}

/* Empty */
.empty{text-align:center;padding:80px 20px}
.empty .e-icon{font-size:48px;margin-bottom:12px;font-weight:300;color:var(--sub)}
.empty h3{font-size:18px;font-weight:700;margin-bottom:4px}
.empty p{font-size:14px;color:var(--sub)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border-radius:20px;padding:28px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}

/* Share Card Canvas (hidden) */
#shareCanvas{display:none}
.share-preview{width:100%;border-radius:12px;margin:12px 0;box-shadow:0 4px 20px rgba(0,0,0,.1)}
</style>
</head>
<body>

<div id="loadingBox"><div class="ld-dot"></div><p id="loadMsg">词汇数据加载中</p></div>

<div id="app" style="display:none">
  <div class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">N</div>
        <div class="brand-text">NANA学姐</div>
      </div>
      <div class="streak">已坚持 <b id="streakCount">0</b> 天</div>
    </div>
  </div>
  <div id="mainContent"></div>
</div>

<nav class="tabs" id="tabs" style="display:none">
  <div class="tab active" data-tab="study"><span class="t-dot"></span>背诵</div>
  <div class="tab" data-tab="levels"><span class="t-dot"></span>闯关</div>
  <div class="tab" data-tab="passages"><span class="t-dot"></span>短文</div>
  <div class="tab" data-tab="review"><span class="t-dot"></span>复习<span class="badge" id="rvBadge" style="display:none">0</span></div>
  <div class="tab" data-tab="profile"><span class="t-dot"></span>我的</div>
</nav>

<canvas id="shareCanvas" width="750" height="1100"></canvas>

<script>
var script = document.createElement('script');
script.src = '../vocab-data.js';
script.onload = function(){ setTimeout(initApp, 200); };
script.onerror = function(){ document.getElementById('loadMsg').innerHTML = '加载失败<br><button onclick=location.reload() style="margin-top:12px;padding:10px 24px;border-radius:20px;background:#C83C3C;color:#fff;border:none;font-size:14px;font-weight:600">重试</button>'; };
document.head.appendChild(script);

var EBB=[1],HIGH_DAILY=100,FULL_DAILY=150;
var tab='study',fcIdx=0,fcWords=[],flipped=false,qzIdx=0,qzWords=[],qzScore=0;
var HIGH_SET=null;

function getHighSet(){
  if(HIGH_SET)return HIGH_SET;
  HIGH_SET={};
  for(var i=0;i<10;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++)HIGH_SET[lv.words[j].w.toLowerCase()]=true;
  }
  return HIGH_SET;
}
function isHigh(w){ return getHighSet()[w.toLowerCase()]||false; }
function today(){ return new Date().toISOString().slice(0,10); }
function load(){ try{ return JSON.parse(localStorage.getItem('nana_v')||'{}'); }catch(e){ return {}; } }
function save(d){ localStorage.setItem('nana_v',JSON.stringify(d)); }
function toast(m){ var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1500); }
function getPhase(p){ return ((p.done||[]).length<10)?'high':'full'; }
function getDailyTarget(p){ return getPhase(p)==='high'?HIGH_DAILY:FULL_DAILY; }
function getPhaseDay(p){ var d=(p.done||[]).length;return getPhase(p)==='high'?d+1:d-9; }

function checkUpdate(){
  fetch('version.json?t='+Date.now()).then(function(r){return r.json()}).then(function(d){
    if(d.v !== '20250812' && localStorage.getItem('app_ver_skip') !== d.v){
      var b=document.createElement('div');
      b.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#C83C3C;color:#fff;padding:10px 16px;text-align:center;font-size:13px;font-weight:600;z-index:9999;cursor:pointer';
      b.innerHTML='有新版本，点击刷新 <span style=background:rgba(255,255,255,.2);padding:2px 10px;border-radius:10px;font-size:12px>更新</span>';
      b.onclick=function(){localStorage.removeItem('app_ver_skip');location.reload(true);};
      document.body.insertBefore(b,document.body.firstChild);
    }
  }).catch(function(){});
}
function initApp(){if(localStorage.getItem("nana_act")!=="1"){window.location.href="index.html";return;}
  document.getElementById('loadingBox').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('tabs').style.display='flex';
  var p=load();document.getElementById('streakCount').textContent=(p.days||0);
  render();
}

function switchTab(t){ tab=t;document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('active',el.dataset.tab===t);});render(); }
document.getElementById('tabs').addEventListener('click',function(e){ var el=e.target.closest('.tab');if(el)switchTab(el.dataset.tab); });

function todayWords(){
  var p=load(),ts=today(),words=[];
  var phase=getPhase(p),dt=getDailyTarget(p),sl=0,el=30;
  var newPool=[];
  for(var i=sl;i<el;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){var w=lv.words[j],ws=p[w.w]||{};if(!ws.seen)newPool.push({w:w.w,m:w.m,lid:lv.id,isNew:true,isH:isHigh(w.w)});}
  }
  var revPool=[];
  for(var i=0;i<LEVELS.length;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){var w=lv.words[j],ws=p[w.w];if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')revPool.push({w:w.w,m:w.m,lid:lv.id,isRev:true,rnd:ws.rnd||0,isH:isHigh(w.w)});}
  }
  if(phase==='full'){
    var eh=[];
    for(var i=0;i<10;i++){ var lv=LEVELS[i];
      for(var j=0;j<lv.words.length;j++){var w=lv.words[j],ws=p[w.w]||{};if(ws.s&&ws.nr!=='2099-01-01'&&(!ws.nr||ws.nr>ts))eh.push({w:w.w,m:w.m,lid:lv.id,isRev:true,rnd:ws.rnd||0,isH:true});}
    }
    eh.sort(function(){return Math.random()-.5});revPool=revPool.concat(eh.slice(0,30));
    var seen={};revPool=revPool.filter(function(x){var k=x.w;if(seen[k])return false;seen[k]=true;return true;});
  }
  var nt=newPool.slice(0,Math.max(0,dt-revPool.length));
  return revPool.concat(nt);
}

function render(){
  var p=load(),c=document.getElementById('mainContent');
  updateBadge(p);document.getElementById('streakCount').textContent=(p.days||0);
  if(tab==='study')renderStudy(c,p);
  else if(tab==='levels')renderLevels(c,p);
  else if(tab==='passages')renderPassages(c,p);
  else if(tab==='review')renderReview(c,p);
  else if(tab==='profile')renderProfile(c,p);
}

function updateBadge(p){
  var ts=today(),cnt=0;
  for(var i=0;i<LEVELS.length;i++){var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){var ws=p[lv.words[j].w];if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')cnt++;}
  }
  var b=document.getElementById('rvBadge');
  if(cnt>0){b.style.display='inline';b.textContent=cnt>99?'99+':cnt;}else b.style.display='none';
}

// ====== TAB1: 背诵 ======
function renderStudy(c,p){
  var words=todayWords(),dt=getDailyTarget(p),phase=getPhase(p);
  var tp=phase==='high'?971:(TOTAL-971);
  var sp=0,sl=0,el=30;
  for(var i=sl;i<el;i++){var lv=LEVELS[i];for(var j=0;j<lv.words.length;j++){if(p[lv.words[j].w]&&p[lv.words[j].w].s)sp++;}}
  var pct=Math.round(sp/tp*100),circ=2*Math.PI*58,off=circ*(1-pct/100);

  if(words.length===0){
    c.innerHTML='<div class="empty"><div class="e-icon">✓</div><h3>今日任务完成</h3><p>已学 '+sp+'/'+tp+' 词 · 第'+(p.days||0)+'天</p><button class="btn btn-r btn-blk" style="max-width:200px;margin:16px auto" onclick="switchTab(\'levels\')">去闯关测试</button></div>';
    return;
  }
  fcWords=words;flipped=false;
  // 断点续接：如果今天背过一部分，从上次断开处继续
  var savedIdx=parseInt(localStorage.getItem('nana_study_idx')||'0');
  var savedDate=localStorage.getItem('nana_study_date')||'';
  if(savedDate===today() && savedIdx>0 && savedIdx<fcWords.length){
    fcIdx=savedIdx;
  }else{
    fcIdx=0;
    localStorage.setItem('nana_study_idx','0');
    localStorage.setItem('nana_study_date',today());
  }
  var hc=words.filter(function(w){return w.isH;}).length;
  var pn=phase==='high'?'高频速通':'正式背诵',pd=getPhaseDay(p);

  c.innerHTML=
    '<div style="text-align:center;padding:24px 16px 0">'+
    '<div style="font-size:12px;color:var(--sub);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">'+pn+' · DAY '+pd+'</div>'+
    '<div class="progress-ring"><svg width="140" height="140" viewBox="0 0 140 140"><circle class="bg" cx="70" cy="70" r="58"/><circle class="fg" cx="70" cy="70" r="58" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/></svg>'+
    '<div class="txt"><div class="big">'+pct+'%</div><div class="sub">'+sp+' / '+tp+'</div></div></div>'+
    '<div style="font-size:13px;color:var(--sub);margin:12px 0">今日目标 <b style="color:var(--red)">'+dt+'</b> 词 · 待背 <b style="color:var(--text)">'+words.length+'</b> 词'+(hc>0?' · <b style="color:var(--gold)">'+hc+'</b> 高频':'')+'</div>'+
    '<div style="padding:0 40px"><button class="btn btn-r btn-blk" onclick="startStudy()">开始背诵</button></div></div>';
}

function startStudy(){ if(fcWords.length===0){toast('今天没有要背的词了');return;}showFC(); }

function showFC(){
  if(fcIdx>=fcWords.length){
    var p=load();if(p.ld!==today()){p.days=(p.days||0)+1;p.ld=today();save(p);}
    localStorage.removeItem('nana_study_idx');localStorage.removeItem('nana_study_date');
    document.getElementById('mainContent').innerHTML='<div class="empty"><div class="e-icon">✓</div><h3>本轮完成</h3><p>今日 '+fcWords.length+' 词 · 连续第'+(p.days||0)+'天</p><button class="btn btn-r btn-blk" style="max-width:200px;margin:12px auto" onclick="switchTab(\'levels\')">去闯关</button><button class="btn btn-w btn-blk" style="max-width:200px;margin:8px auto" onclick="switchTab(\'study\')">回主页</button></div>';
    return;
  }
  var w=fcWords[fcIdx];flipped=false;
  document.getElementById('mainContent').innerHTML=
    '<div style="padding:8px 16px"><div style="font-size:12px;color:var(--sub);text-align:center;margin-bottom:10px">'+(fcIdx+1)+' / '+fcWords.length+'</div>'+
    '<div class="flashcard" id="fc" onclick="flip()">'+
    '<span class="tag '+(w.isNew?'tag-n':'tag-r')+'">'+(w.isNew?'新词':'复习')+(w.isH?' · 高频':'')+'</span>'+
    '<div class="w">'+w.w+(w.isH?' <span class="star-mark">●</span>':'')+'</div>'+
    '<div class="m" id="fcm" style="display:none">'+w.m+'</div>'+
    '<div class="hint" id="fch">轻触查看释义</div></div>'+
    '<div style="display:flex;gap:10px;padding:0 16px;margin-top:14px" id="fca">'+
    '<button class="btn btn-w btn-blk" onclick="mark(false)">不认识</button>'+
    '<button class="btn btn-r btn-blk" onclick="mark(true)">认识了</button></div></div>';
  document.getElementById('fca').style.display='none';window.scrollTo(0,0);
}

function flip(){ if(flipped)return;flipped=true;document.getElementById('fcm').style.display='block';document.getElementById('fch').style.display='none';document.getElementById('fca').style.display='flex'; }

function mark(ok){
  var w=fcWords[fcIdx],p=load(),k=w.w,ws=p[k]||{s:false,c:0,w:0,rnd:0,nr:''};
  ws.s=true;
  if(ok){ws.c++;p.tc=(p.tc||0)+1;ws.rnd=Math.min(ws.rnd+1,EBB.length);
    if(ws.rnd<EBB.length){var d=new Date();d.setDate(d.getDate()+EBB[ws.rnd]);ws.nr=d.toISOString().slice(0,10);}else ws.nr='2099-01-01';
  }else{ws.w++;p.tw=(p.tw||0)+1;ws.rnd=0;var d=new Date();d.setDate(d.getDate()+1);ws.nr=d.toISOString().slice(0,10);}
  p[k]=ws;save(p);fcIdx++;
  // 保存背诵进度，断点续接
  localStorage.setItem('nana_study_idx',fcIdx);
  localStorage.setItem('nana_study_date',today());
  showFC();
}

// ====== TAB2: 闯关 ======
function renderLevels(c,p){
  var hd=0;for(var i=0;i<10;i++){var lv=LEVELS[i];for(var j=0;j<(p.done||[]).length;j++){if(p.done[j].id===lv.id&&p.done[j].stars>=2){hd++;break;}}}
  var fd=0;for(var i=10;i<30;i++){var lv=LEVELS[i];for(var j=0;j<(p.done||[]).length;j++){if(p.done[j].id===lv.id&&p.done[j].stars>=2){fd++;break;}}}

  var h='<div class="phase-card"><div class="ph-top"><div class="ph-dot" style="background:var(--gold)"></div><div class="ph-info"><div class="ph-name">高频速通</div><div class="ph-sub">Lv 1-10 · 971词 · 100词/天 · 10天</div></div><div class="ph-count" style="color:var(--gold)">'+hd+'<span style="font-size:13px;color:var(--sub)">/10</span></div></div><div class="phase-bar"><div class="phase-bar-fill" style="background:var(--gold);width:'+(hd*10)+'%"></div></div><div class="level-grid">';
  for(var i=0;i<10;i++){var lv=LEVELS[i],isD=false,st=0;
    for(var j=0;j<(p.done||[]).length;j++){if(p.done[j].id===lv.id){isD=true;st=p.done[j].stars;break;}}
    var cls=isD?'done':(i===hd?'today':(i>hd?'locked':'done'));
    h+='<div class="level-dot '+cls+'"'+(cls!=='locked'?' onclick="startQuiz('+lv.id+')"':'')+'>'+(i+1)+'<br>'+(isD?'●'.repeat(st):cls==='today'?'GO':'○')+'</div>';
  }
  h+='</div></div>';

  h+='<div class="phase-card"><div class="ph-top"><div class="ph-dot" style="background:var(--red)"></div><div class="ph-info"><div class="ph-name">正式背诵</div><div class="ph-sub">Lv 1-30 · 3946词（含高频复习）· 150词/天 · '+(hd>=10?'已解锁':'高频通关后解锁')+'</div></div><div class="ph-count" style="color:var(--red)">'+fd+'<span style="font-size:13px;color:var(--sub)">/20</span></div></div><div class="phase-bar"><div class="phase-bar-fill" style="background:var(--red);width:"+(fd*3.7)+"%"></div></div>';
  if(hd>=10){
    h+='<div class="level-grid">';
    for(var i=10;i<30;i++){var lv=LEVELS[i],isD=false,st=0;
      for(var j=0;j<(p.done||[]).length;j++){if(p.done[j].id===lv.id){isD=true;st=p.done[j].stars;break;}}
      var unl=i===10;for(var j=0;j<(p.done||[]).length;j++){if(p.done[j].id===i&&p.done[j].stars>=2)unl=true;}
      var cls=isD?'done':(!unl?'locked':'');
      h+='<div class="level-dot '+cls+'"'+(cls!=='locked'?' onclick="startQuiz('+lv.id+')"':'')+'>'+(i+1)+'<br>'+(isD?'●'.repeat(st):'○')+'</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  c.innerHTML=h;
}

function startQuiz(id){
  var lv=null;for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].id===id)lv=LEVELS[i];
  if(!lv)return;
  var ws=lv.words.slice().sort(function(){return Math.random()-.5});
  qzWords=ws.slice(0,Math.min(20,ws.length));qzIdx=0;qzScore=0;showQuiz();
}

function showQuiz(){
  if(qzIdx>=qzWords.length){finishQuiz();return;}
  var w=qzWords[qzIdx],all=[];
  for(var i=0;i<LEVELS.length;i++)all=all.concat(LEVELS[i].words);
  var wrong=all.filter(function(x){return x.w!==w.w;}).sort(function(){return Math.random()-.5}).slice(0,3).map(function(x){return x.m;});
  var opts=wrong.concat([w.m]).sort(function(){return Math.random()-.5}),ci=opts.indexOf(w.m);
  document.getElementById('mainContent').innerHTML=
    '<div style="text-align:center;padding:20px 16px 0"><div style="font-size:13px;font-weight:600;color:var(--text)">Lv '+qzWords[0].lid+' 闯关测试</div><div style="font-size:12px;color:var(--sub);margin-top:4px">'+(qzIdx+1)+'/'+qzWords.length+' · '+qzScore+'分</div><div style="height:3px;background:var(--light);border-radius:2px;margin:14px 0;overflow:hidden"><div style="height:100%;background:var(--red);width:'+(qzIdx/qzWords.length*100)+'%;transition:width .3s"></div></div></div>'+
    '<div class="quiz-word">'+w.w+(isHigh(w.w)?' <span class="star-mark">●</span>':'')+'</div>'+
    '<div class="quiz-options" id="qzOpts">'+opts.map(function(o,i){return '<div class="quiz-opt" data-ci="'+(i===ci)+'" onclick="answerQuiz(this)">'+o+'</div>';}).join('')+'</div>'+
    '<div style="text-align:center;margin-top:18px"><button class="btn btn-w" onclick="switchTab(\'levels\')">退出</button></div>';
}

function answerQuiz(el){
  var ok=el.dataset.ci==='true',opts=document.querySelectorAll('#qzOpts .quiz-opt');
  for(var i=0;i<opts.length;i++)opts[i].style.pointerEvents='none';
  if(ok){el.classList.add('correct');qzScore++;}else{el.classList.add('wrong');for(var i=0;i<opts.length;i++)if(opts[i].dataset.ci==='true')opts[i].classList.add('correct');}
  setTimeout(function(){qzIdx++;showQuiz();},600);
}

function finishQuiz(){
  var pct=Math.round(qzScore/qzWords.length*100),stars=pct>=95?3:pct>=80?2:pct>=60?1:0,passed=stars>=2;
  var p=load(),lvId=qzWords[0].lid,ex=null;
  for(var i=0;i<(p.done||[]).length;i++)if(p.done[i].id===lvId)ex=p.done[i];
  if(!ex||stars>ex.stars){if(ex){ex.stars=stars;ex.date=today();}else{p.done=(p.done||[]);p.done.push({id:lvId,stars:stars,date:today()});}save(p);}
  document.getElementById('mainContent').innerHTML=
    '<div class="empty"><div class="e-icon">'+(passed?'●':'○')+'</div><h3>'+(passed?'通关成功':'继续加油')+'</h3>'+
    '<p style="font-size:14px;margin:4px 0">正确率 '+pct+'% · '+qzScore+'/'+qzWords.length+'</p>'+
    '<div style="font-size:28px;margin:8px 0;letter-spacing:4px">'+'●'.repeat(stars)+'○'.repeat(3-stars)+'</div>'+
    (passed&&lvId<30?'<button class="btn btn-r btn-blk" style="max-width:200px;margin:8px auto" onclick="startQuiz('+(lvId+1)+')">下一关</button>':'')+
    (stars<2?'<button class="btn btn-r btn-blk" style="max-width:200px;margin:8px auto" onclick="startQuiz('+lvId+')">重新挑战</button>':'')+
    '<button class="btn btn-w btn-blk" style="max-width:200px;margin:8px auto" onclick="switchTab(\'levels\')">返回</button>'+
    (passed?'<button class="btn btn-r btn-blk" style="max-width:200px;margin:8px auto" onclick="shareResult('+lvId+','+pct+','+stars+')">生成打卡图</button>':'')+'</div>';
}

// ====== 分享打卡图 ======
function shareResult(lvId,pct,stars){
  var p=load(),seen=Object.keys(p).filter(function(k){return p[k]&&p[k].s;}).length,mastered=Object.keys(p).filter(function(k){return p[k]&&p[k].nr==='2099-01-01';}).length;
  var acc=p.tc+p.tw>0?Math.round(p.tc/(p.tc+p.tw)*100):0;
  generateShareCard(lvId,pct,stars,{days:p.days||0,seen:seen,mastered:mastered,accuracy:acc});
}

function generateShareCard(lvId,pct,stars,stats){
  var cvs=document.getElementById('shareCanvas'),ctx=cvs.getContext('2d');
  var w=750,h=1100;
  ctx.clearRect(0,0,w,h);

  // Background
  var bg=ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#2C1810');bg.addColorStop(.4,'#3D1A1A');bg.addColorStop(.7,'#1A0A0A');bg.addColorStop(1,'#0D0505');
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);

  // Subtle circles
  ctx.fillStyle='rgba(200,60,60,.06)';
  ctx.beginPath();ctx.arc(600,200,300,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(150,800,250,0,Math.PI*2);ctx.fill();

  // Top: brand
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='28px -apple-system,"PingFang SC",sans-serif';ctx.textAlign='center';
  ctx.fillText('学 囤 囤',w/2,80);

  // Divider
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(60,110);ctx.lineTo(w-60,110);ctx.stroke();

  // Title
  ctx.fillStyle='#fff';ctx.font='bold 44px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('高考词汇速通关',w/2,170);

  // Level badge
  ctx.fillStyle='rgba(200,60,60,.3)';ctx.beginPath();
  roundRect(ctx,w/2-100,200,200,50,24);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 64px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('Lv '+lvId,w/2,260);
  ctx.font='20px -apple-system,"PingFang SC",sans-serif';ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.fillText('通关成功',w/2,295);

  // Score
  ctx.fillStyle='#C83C3C';ctx.font='bold 96px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(pct+'%',w/2,410);
  ctx.font='22px -apple-system,"PingFang SC",sans-serif';ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillText('正确率',w/2,445);

  // Stars
  var starStr='';for(var i=0;i<stars;i++)starStr+='● ';for(var i=stars;i<3;i++)starStr+='○ ';
  ctx.fillStyle='#C8963C';ctx.font='30px -apple-system';ctx.fillText(starStr.trim(),w/2,490);

  // Stats
  var statsY=550;
  ctx.fillStyle='rgba(255,255,255,.1)';roundRect(ctx,40,statsY,w-80,260,20);ctx.fill();

  var statItems=[
    {label:'学习天数',value:stats.days+' 天'},
    {label:'已学词汇',value:stats.seen+' 词'},
    {label:'已掌握',value:stats.mastered+' 词'},
    {label:'总正确率',value:stats.accuracy+'%'}
  ];
  ctx.textAlign='center';
  for(var si=0;si<statItems.length;si++){
    var sx=60+(si%2)*340, sy=statsY+50+Math.floor(si/2)*100;
    ctx.fillStyle='#fff';ctx.font='bold 42px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(statItems[si].value,sx+140,sy+20);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='20px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(statItems[si].label,sx+140,sy+48);
  }

  // Footer
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='18px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(today()+' · NANA学姐出品',w/2,h-60);
  ctx.fillText('扫码加入 高考词汇速通关',w/2,h-30);

  // Show as image
  var dataUrl=cvs.toDataURL('image/png');

  var ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML='<div class="modal-box"><h3 style="font-size:18px;font-weight:700;margin-bottom:4px">背诵打卡图已生成</h3><p style="font-size:13px;color:var(--sub);margin-bottom:12px">长按保存图片，可发朋友圈或发给老师</p><img src="'+dataUrl+'" class="share-preview" alt="打卡图"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-r" style="flex:1" onclick="saveShareCard()">保存图片</button><button class="btn btn-w" style="flex:1" onclick="this.closest(\'.modal-overlay\').remove()">关闭</button></div></div>';
  document.body.appendChild(ov);ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  ov._imgData=dataUrl;
}

function saveShareCard(){
  var ov=document.querySelector('.modal-overlay');
  if(!ov||!ov._imgData)return;
  var a=document.createElement('a');a.href=ov._imgData;a.download='NANA学姐打卡_'+today()+'.png';
  document.body.appendChild(a);a.click();a.remove();toast('已保存');
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

  {t:"Bridging Cultures",tag:"文化交流",
   en:"Last summer, Lisa had an extraordinary opportunity to participate in an international exchange program in London. As someone who had never traveled abroad, she felt both excited and anxious. The first few days were overwhelming. Everything seemed different — the food, the weather, the way people communicated. Lisa struggled to understand the local accent and often felt awkward in social situations. But gradually, things began to change. She made friends with students from various countries — Japan, Brazil, Germany, and Kenya. Each conversation was a window into a different culture. She discovered that despite obvious differences, young people everywhere share similar dreams, fears, and hopes. One evening, the program organized a cultural night where everyone presented something from their home country. Lisa performed a traditional Chinese dance and explained the meaning behind the movements. The audience was fascinated. This experience transformed Lisa's perspective. Cultural differences are not barriers but bridges.",
   cn:"去年夏天，丽莎获得了参加伦敦国际交流项目的非凡机会。从未出过国的她既兴奋又焦虑。最初几天让人不知所措，一切似乎都不同——食物、天气、人们交流的方式。丽莎努力理解当地口音，在社交场合常感尴尬。但渐渐地，情况改变了。她与来自日本、巴西、德国和肯尼亚的学生交了朋友。每次对话都是通向不同文化的窗口。她发现尽管存在明显差异，世界各地的年轻人分享着相似的梦想和希望。一晚，项目组织了文化之夜，每人展示来自自己国家的东西。丽莎表演了中国传统舞蹈并解释动作含义，观众深深着迷。这次经历转变了丽莎的视角：文化差异不是障碍，而是桥梁。"},
  {t:"Learning How to Learn",tag:"学习方法",
   en:"For years, Kevin believed that intelligence was something you were born with. He assumed that students who achieved top grades were simply smarter than him. This belief became a convenient excuse for not trying harder. But everything changed when he encountered the concept of a 'growth mindset.' The theory suggests that the brain is like a muscle — it grows stronger with use. Intelligence is not fixed; it can be developed through effort, effective strategies, and persistence. Kevin was skeptical at first, but he decided to conduct an experiment on himself. Instead of passively reading textbooks, he began to actively engage with the material. He used techniques like spaced repetition, active recall, and the Feynman method. He made connections between different subjects and applied what he learned to real problems. The results were remarkable. Within a few months, his grades improved significantly. More importantly, his attitude toward learning transformed. He realized that making mistakes was not a sign of failure but an essential part of the learning process.",
   cn:"多年来，凯文相信智力是天生的。他认为取得好成绩的学生只是比他聪明。这个信念成了不努力的借口。但当他接触到'成长型思维'概念时，一切都变了。理论表明大脑像肌肉——越用越强。智力不是固定的，可以通过努力、有效策略和坚持来发展。凯文起初怀疑，但决定在自己身上做实验。他不再被动阅读课本，而是积极与材料互动。他用间隔重复、主动回忆和费曼技巧等方法。在不同学科间建立联系，将所学应用于实际问题。结果非常显著——几个月内成绩大幅提高。更重要的是，他对学习的态度转变了。他意识到犯错不是失败的标志，而是学习过程中必不可少的环节。"},
  {t:"Rising After the Fall",tag:"励志成功",
   en:"Failure is perhaps the most underrated teacher in life. Society celebrates success and hides failure, creating the illusion that successful people achieved their goals without struggle. Nothing could be further from the truth. Consider J.K. Rowling, the author of the Harry Potter series. Before her books sold over 500 million copies worldwide, she was a single mother living on welfare, struggling with depression. Her manuscript was rejected by twelve publishers before someone finally took a chance on it. If she had quit after the eleventh rejection, the world would have missed one of the most beloved stories ever told. What distinguishes those who ultimately succeed from those who do not is rarely talent alone. More often, it is resilience — the ability to recover from setbacks and continue moving forward. Resilience is not a fixed trait but a skill developed through the very experience of failing and getting back up. Every failure contains a lesson if you are willing to look for it.",
   cn:"失败也许是生活中最被低估的老师。社会赞美成功，隐藏失败，制造出成功者不费吹灰之力的假象。事实远非如此。想想哈利波特系列的作者J.K.罗琳。在她的书全球销量超五亿册之前，她是一位靠福利生活的单身母亲，与抑郁作斗争。手稿被十二家出版商拒绝后才有人愿意一试。如果她在第十一次拒绝后放弃了，世界将错过最受喜爱的故事之一。区分最终成功者与失败者的，很少仅仅是天赋。更多时候是韧性——从挫折中恢复并继续前行的能力。韧性不是固定特质，而是通过失败和重新站起的经历培养的技能。每一次失败都蕴含教训，只要愿意寻找。"},
  {t:"Digital Lives",tag:"网络时代",
   en:"The internet has fundamentally altered the way we live, work, and connect with one another. For the current generation of teenagers, life without digital technology is almost unimaginable. They access information at their fingertips, communicate across continents in seconds, and express their identities through various online platforms. Yet this constant connection comes at a cost. Studies reveal that excessive screen time is linked to increased rates of anxiety, depression, and sleep disorders among young people. The pressure to maintain a perfect online image can be exhausting. The fear of missing out keeps many individuals glued to their screens. The spread of false information is another serious concern. However, blaming technology for these problems would be too simplistic. The internet is a tool, and like any tool, its impact depends on how we choose to use it. The challenge for today's youth is to develop a healthy relationship with technology — one that enhances rather than diminishes their lives.",
   cn:"互联网已根本性地改变了我们生活、工作和连接的方式。对当代青少年来说，没有数字技术的生活几乎不可想象。他们在指尖获取信息，在几秒内跨越大洲交流，通过各种在线平台表达自我。然而这种持续连接是有代价的。研究表明过度的屏幕时间与青少年焦虑、抑郁和睡眠障碍增加有关。维持完美在线形象的压力令人精疲力竭。错失恐惧症让许多人粘在屏幕上。虚假信息的传播是另一严重关切。然而，将问题归咎于科技本身过于简单。互联网是工具，其影响取决于我们如何使用。当代年轻人的挑战是与科技建立健康关系——增强而非削弱生活。"},
  {t:"Dreams Take Flight",tag:"梦想未来",
   en:"Every great achievement in human history began as a dream in someone's mind. The ability to imagine a future that does not yet exist — and then work tirelessly to make it real — is perhaps the most remarkable of all human qualities. What is your dream? It does not have to be grandiose. It might be to become a teacher who inspires the next generation, or to start a business that solves a problem in your community. Whatever your dream, it is valid and worth pursuing. But having a dream is only the beginning. The path from dream to reality is almost always longer and more difficult than we expect. There will be obstacles, doubts, and moments when giving up seems like the only reasonable option. At those moments, what sustains us is a deeper sense of purpose — a belief that what we are doing matters. The world needs dreamers who refuse to accept the status quo and dare to ask 'What if?' But the world also needs doers who can translate vision into action. Dream boldly. Plan carefully. Work patiently. Your story is just beginning.",
   cn:"人类历史上每项伟大成就都始于某人脑中的梦想。想象一个尚不存在的未来，然后不懈努力将其变为现实——这也许是最了不起的人类品质。你的梦想是什么？不必宏大。可能是成为激励下一代的老师，或创办解决社区问题的企业。无论梦想是什么，都值得追求。但拥有梦想只是开始。从梦想到现实的道路几乎总是比预期更长更艰难。会有障碍、怀疑，以及放弃似乎是唯一合理选择的时刻。在那些时刻，支撑我们的是更深的使命感——相信所做的事很重要。世界需要拒绝现状、敢于问'如果呢'的梦想家，也需要能将愿景转化为行动的实干家。大胆梦想，谨慎规划，耐心努力。你的故事才刚刚开始。"},
  {t:"The Art of Persistence",tag:"毅力培养",
   en:"Nothing in the world can take the place of persistence. Talent will not — nothing is more common than unsuccessful people with talent. Genius will not — unrewarded genius is almost a proverb. Education alone will not — the world is full of educated failures. Persistence and determination alone are overwhelmingly powerful. Consider Thomas Edison, who failed thousands of times before inventing the light bulb. When asked about his failures, he famously replied that he had not failed — he had just found thousands of ways that would not work. This attitude transformed human civilization. Every successful person you admire has a history of showing up day after day, long after the initial excitement faded. They understood something fundamental: consistent effort compounds over time in ways that occasional bursts of inspiration never can. The key is not intensity but consistency. Do not wait for motivation. Build discipline. Show up even when you do not feel like it. Over time, those small daily actions accumulate into something remarkable.",
   cn:"世界上没有什么能取代坚持。天赋不能——没有什么比怀才不遇更常见了。天才不能——不被认可的天才几乎是一个谚语。单靠教育也不能——世界充满了受过教育的失败者。坚持和决心本身就具有压倒性的力量。想想爱迪生，在发明电灯泡之前失败了数千次。当被问及他的失败时，他给出了著名的回答：他没有失败，只是找到了数千种行不通的方法。这种态度改变了人类文明。你钦佩的每个成功者都有在最初的兴奋消退后日复一日坚持的历史。他们理解一个基本的道理：持续的努力会随着时间复利增长，而偶尔的灵感爆发永远无法做到。关键不是强度，而是一致性。不要等待动力，建立纪律。即使不想做也要出现。随着时间的推移，这些微小的日常行动会累积成非凡的成就。"},
  {t:"Finding Your Voice",tag:"自我表达",
   en:"Every individual has a unique voice waiting to be discovered and expressed. Finding it, however, is rarely a straightforward journey. It requires courage to speak your truth when the world encourages conformity. Emma was always the quiet student in class. She had ideas, opinions, and a rich inner world, but she struggled to share them. The fear of being judged kept her silent. Everything changed when her English teacher assigned a personal essay project. Write about something that matters to you, the teacher said, not what you think I want to read. That simple instruction opened a door. Emma wrote about her grandmother, who had survived war and displacement to build a new life. The words flowed because they came from a genuine place. When her essay was read aloud in class, her classmates were moved. Emma realized that her voice had value — not because it was perfect, but because it was honest. From that moment, she began to participate more, to speak up in discussions, and to trust her own perspective.",
   cn:"每个人都有独特的声音等待被发现和表达。然而找到它很少是一帆风顺的旅程。当世界鼓励从众时，说出真相需要勇气。艾玛一直是班上安静的学生。她有想法、有观点、有丰富的内心世界，但却难以分享它们。对被评判的恐惧让她保持沉默。当英语老师布置了一篇个人散文作业时，一切都变了。写一些对你重要的事情，老师说，不要写你认为我想读的。这个简单的指示打开了一扇门。艾玛写了她祖母的故事，她经历了战争和流离失所，建立了新的生活。文字从心底流淌而出。当她的文章在班上朗读时，同学们都被感动了。艾玛意识到她的声音有价值——不是因为它完美，而是因为它诚实。从那一刻起，她开始更多地参与，在讨论中发言，并相信自己的视角。"},
  {t:"The Gift of Gratitude",tag:"感恩心态",
   en:"In the rush of daily life, it is easy to focus on what we lack rather than what we have. Social media constantly shows us carefully curated versions of other people's lives, making our own seem inadequate by comparison. Yet research consistently shows that gratitude is one of the strongest predictors of happiness and well-being. People who regularly take time to notice and appreciate the good things in their lives sleep better, have stronger relationships, and are more resilient in the face of challenges. Gratitude is not about ignoring problems or pretending everything is perfect. It is about training your mind to notice what is going right, not just what is going wrong. A simple practice: every evening, write down three things you are grateful for. They do not have to be big — a good conversation, a warm meal, a moment of laughter. Over time, this rewires your brain to scan the world for positives rather than negatives.",
   cn:"在日常生活的匆忙中，很容易关注我们缺少什么而非拥有什么。社交媒体不断向我们展示他人精心策划的生活版本，让我们自己的显得相形见绌。然而研究一致表明，感恩是幸福和健康的最强预测因素之一。定期花时间注意和欣赏生活中美好事物的人睡得更好，拥有更牢固的关系，面对挑战时更具韧性。感恩不是忽视问题或假装一切完美。而是训练你的心智去注意什么事情做对了，而不仅仅是做错了什么。一个简单的练习：每晚写下你感恩的三件事。不必是大事——一次好的对话，一顿温暖的饭菜，一个欢笑的瞬间。随着时间的推移，这将重塑你的大脑，让它扫描世界中的积极面而非消极面。"},
  {t:"The Science of Sleep",tag:"健康管理",
   en:"Sleep is often the first thing students sacrifice when life gets busy. Late-night study sessions and early morning classes create a pattern of chronic sleep deprivation that many wear as a badge of honor. However, the science is clear: sleep is not a luxury but a biological necessity. During sleep, your brain consolidates memories, processes emotions, and clears out toxins that accumulate during waking hours. Students who consistently get adequate sleep perform better on tests, have stronger immune systems, and report greater emotional stability. The idea that you can train yourself to need less sleep is a myth. While individual needs vary slightly, the vast majority of teenagers require eight to ten hours per night. The most effective study strategy is not to stay up later but to sleep well and study with a refreshed mind.",
   cn:"睡眠往往是学生在生活忙碌时最先牺牲的东西。深夜学习和清晨课程造成了长期睡眠不足的模式，许多人将其视为荣誉勋章。然而科学很清楚：睡眠不是奢侈品，而是生理必需品。在睡眠期间，你的大脑巩固记忆，处理情绪，并清除清醒时积累的毒素。持续获得充足睡眠的学生考试成绩更好，免疫系统更强，情绪更稳定。你可以训练自己需要更少睡眠的想法是一个迷思。虽然个体需求略有不同，但绝大多数青少年每晚需要八到十小时。最有效的学习策略不是熬夜更晚，而是睡好觉，用清醒的头脑学习。"},
  {t:"Money Matters",tag:"财商启蒙",
   en:"Financial literacy is rarely taught in schools, yet it is one of the most important life skills. Many young people enter adulthood with little understanding of how to manage money, and the consequences can last for decades. The basic principles are simple but powerful. First, spend less than you earn — this sounds obvious, but it is the foundation of all financial health. Second, start saving early, even small amounts, because compound interest is one of the most powerful forces in the universe. Third, distinguish between needs and wants — a need is something you cannot live without, while a want is something that would be nice to have. Learning to delay gratification is a skill that serves you in every area of life, not just finance. You do not need to become an expert, but understanding these basics will give you a significant advantage.",
   cn:"财商教育很少在学校教授，但它是最重要的生活技能之一。许多年轻人进入成年时对如何管理金钱知之甚少，后果可能持续数十年。基本原则简单但有力。第一，支出少于收入——这听起来显而易见，但它是所有财务健康的基础。第二，尽早开始储蓄，即使金额很小，因为复利是宇宙中最强大的力量之一。第三，区分需要和想要——需要是你离不开的东西，而想要是锦上添花。学会延迟满足是一项在生活各个领域都有用的技能，不仅仅是财务。你不需要成为专家，但理解这些基础知识将给你带来显著优势。"},
  {t:"The Power of Mentors",tag:"榜样力量",
   en:"Behind almost every successful person is a mentor who believed in them before they believed in themselves. A mentor is someone who has walked the path before you and can offer guidance, perspective, and encouragement when you need it most. Finding a mentor does not require a formal program. It can be a teacher who stays after class to help, a coach who pushes you beyond your limits, or a family friend whose career you admire. The key is to be open and proactive. Ask questions. Seek feedback. Show that you are willing to learn and work hard. Most experienced people are happy to share their knowledge with someone who genuinely wants to grow. And remember that mentorship is a two-way street — the best mentees bring fresh perspectives and energy that benefit their mentors as well.",
   cn:"几乎每个成功人士背后都有一个在他们相信自己之前就相信他们的导师。导师是走过你前面道路的人，可以在你最需要时提供指导、视角和鼓励。找到导师不需要正式的项目。可以是一位课后留下来帮助的老师，一位推动你超越极限的教练，或者一位你钦佩其职业的家庭朋友。关键是开放和主动。提问，寻求反馈，展示你愿意学习和努力。大多数有经验的人都很乐意与真正想成长的人分享知识。记住师徒关系是双向的——最好的被指导者带来新鲜的视角和能量，也能使导师受益。"},
  {t:"Reading Changes Everything",tag:"阅读价值",
   en:"Reading is perhaps the most underrated superpower available to every human being. Through books, you can access the minds of the greatest thinkers who ever lived, travel to places you may never visit, and experience lives completely different from your own — all from a single chair. Regular readers develop larger vocabularies, stronger analytical thinking skills, and greater empathy than non-readers. Yet in the age of短视频 and instant gratification, deep reading is becoming a lost art. The solution is not to read more books but to read better. Choose books that challenge you. Read actively — underline, take notes, ask questions of the text. Discuss what you read with others. A single book, deeply understood, is worth more than a hundred books skimmed. Make reading a daily habit, even if only for fifteen minutes. Over a lifetime, those minutes add up to an education far beyond anything a classroom can provide.",
   cn:"阅读也许是每个人都能拥有的最被低估的超能力。通过书籍，你可以接触历史上最伟大思想家的头脑，游览你可能永远无法访问的地方，体验与自己截然不同的生活——一切只需一把椅子。经常阅读的人比不阅读的人拥有更大的词汇量、更强的分析思维能力和更强的共情能力。然而在短视频和即时满足的时代，深度阅读正成为一门失落的艺术。解决方案不是读更多书，而是读得更好。选择挑战你的书。主动阅读——划线、做笔记、对文本提问。与他人讨论你读到的内容。一本深刻理解的书，胜过一百本浮光掠影的书。让阅读成为日常习惯，即使只有十五分钟。一生中，这些分钟累积成远超出课堂所能提供的教育。"},
  {t:"The Courage to Be Kind",tag:"品格修养",
   en:"In a world that often rewards aggression and self-promotion, choosing kindness can feel like a weakness. Nothing could be further from the truth. True kindness requires immense courage — the courage to be gentle when others are harsh, to include someone who has been excluded, to stand up for someone who cannot stand up for themselves. Kindness is not about being nice or avoiding conflict. It is about recognizing the humanity in every person you encounter, even when it is difficult. Studies show that acts of kindness benefit not just the receiver but also the giver, reducing stress and increasing feelings of connection and purpose. The most respected leaders, from Nelson Mandela to Mother Teresa, were known not for their ruthlessness but for their profound compassion. In the end, how you treat people is your true legacy.",
   cn:"在一个常常奖励侵略和自我推销的世界里，选择善良可能感觉像软弱。但这完全不是真相。真正的善良需要巨大的勇气——在他人刻薄时保持温和的勇气，接纳被排斥者的勇气，为无法自我保护的人挺身而出的勇气。善良不是关于讨好或回避冲突，而是关于认出你遇到的每个人的人性，即使在困难时也是如此。研究表明，善举不仅使接受者受益，也使给予者受益，减少压力，增加连接感和目标感。从纳尔逊·曼德拉到特蕾莎修女，最受尊敬的领导者不是以无情著称，而是以深刻的同情心著称。最终，你如何对待他人是你真正的遗产。"},
  {t:"Embracing Change",tag:"适应变化",
   en:"The only constant in life is change. Yet human beings are naturally resistant to it. We crave stability, routine, and predictability. When change arrives — whether in the form of a new school, a family transition, or a global pandemic — our first instinct is often to resist. But resistance only increases suffering. The alternative is to develop adaptability — the ability to adjust your sails when the wind changes direction. Adaptable people are not those who avoid difficulty. They are those who have learned to view change not as a threat but as an opportunity for growth. Every major transition in your life, no matter how painful at the time, has the potential to teach you something invaluable about yourself. The question is not whether change will come — it will. The question is whether you will meet it with fear or with curiosity.",
   cn:"生活中唯一不变的是变化。然而人类天生抗拒变化。我们渴望稳定、常规和可预测性。当变化来临——无论是新学校、家庭转变还是全球疫情——我们的第一本能往往是抗拒。但抗拒只会增加痛苦。替代方案是培养适应能力——当风向改变时调整帆的能力。适应力强的人不是那些回避困难的人，而是那些学会将变化视为成长机会而非威胁的人。生活中的每一次重大转变，无论当时多么痛苦，都有可能教会你一些关于自己的无价之宝。问题不是变化是否会来——它会的。问题是你将以恐惧还是好奇心迎接它。"},
  {t:"What Success Really Means",tag:"人生思考",
   en:"Society tends to define success in narrow terms: wealth, fame, status, power. But if you look at people who are genuinely fulfilled, you will find that their definition of success is often quite different. For some, success means having the freedom to spend time with people they love. For others, it means doing work that makes a difference, however small. For still others, it means the ongoing pursuit of learning and growth. The danger of accepting society's definition of success without question is that you may spend years climbing a ladder only to find it is leaning against the wrong wall. Take time to define success for yourself. What kind of life would you be proud to have lived when you look back at age eighty? The answer to that question is your true north. Let it guide your decisions, not the expectations of others.",
   cn:"社会倾向于用狭窄的术语定义成功：财富、名声、地位、权力。但如果你看看真正感到满足的人，会发现他们对成功的定义往往截然不同。对一些人来说，成功意味着有自由与所爱的人共度时光。对另一些人来说，意味着做有意义的工作，无论多么微小。对还有一些人来说，意味着持续追求学习和成长。不假思索地接受社会对成功的定义的危险在于，你可能花多年爬梯子，却发现它靠在了错误的墙上。花时间为自己定义成功。当你八十岁回望时，你为过什么样的生活感到骄傲？这个问题的答案就是你的真北。让它指引你的决定，而非他人的期望。"}
];

function renderPassages(c,p){
  var h='<div style="padding:20px 16px 0"><div style="font-size:22px;font-weight:800;margin-bottom:2px">语境短文</div><div style="font-size:13px;color:var(--sub);margin-bottom:12px">在阅读中巩固词汇 · 共20篇 · 含中文翻译</div></div>';
  for(var i=0;i<PASSAGES.length;i++){
    var ps=PASSAGES[i];
    h+='<div class="passage-card" onclick="openPassage('+i+')"><div class="ps-num">0'+(i+1)+'</div><div class="ps-title">'+ps.t+'</div><div class="ps-tag">'+ps.tag+'</div></div>';
  }
  c.innerHTML=h;
}

function openPassage(idx){
  var ps=PASSAGES[idx],rendered=ps.en.replace(/\b([a-zA-Z]+)\b/g,function(m){return isHigh(m)?'<span class="pw-h">'+m+'</span>':m;});
  document.getElementById('mainContent').innerHTML=
    '<div style="padding:18px 16px"><button class="btn btn-w" style="padding:8px 16px;font-size:13px;margin-bottom:12px" onclick="switchTab(\'passages\')">← 返回列表</button>'+
    '<div style="font-size:12px;color:var(--red);font-weight:600;letter-spacing:1px">'+ps.tag+'</div>'+
    '<div style="font-size:24px;font-weight:800;margin:6px 0 16px">'+ps.t+'</div>'+
    '<div class="full-passage">'+rendered+'</div>'+
    '<div class="full-trans"><b>中文翻译</b><br><br>'+ps.cn+'</div>'+
    '<div style="margin-top:16px;padding:10px 14px;background:#F8F0F0;border-radius:10px;font-size:11px;color:var(--redD)">红色标记 = 高频核心词，建议在上下文中理解记忆</div></div>';
}

// ====== TAB4: 复习 ======
function renderReview(c,p){
  var ts=today(),words=[];
  for(var i=0;i<LEVELS.length;i++){var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){var w=lv.words[j],ws=p[w.w];if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')words.push({w:w.w,m:w.m,lid:lv.id,name:lv.name});}
  }
  if(!words.length){c.innerHTML='<div class="empty"><div class="e-icon">✓</div><h3>暂无待复习</h3><p>1+1复习计划正常进行中</p></div>';return;}
  var grp={};for(var i=0;i<words.length;i++){var rw=words[i];if(!grp[rw.lid])grp[rw.lid]={name:rw.name,words:[]};grp[rw.lid].words.push(rw);}
  var h='<div style="padding:20px 16px 0"><div style="font-size:22px;font-weight:800;margin-bottom:2px">复习提醒</div><div style="font-size:13px;color:var(--sub);margin-bottom:12px">今日学新词 · 明日复习 · 1+1记忆法 · 待复习 <b style="color:var(--red)">'+words.length+'</b> 词</div></div>';
  var keys=Object.keys(grp);
  for(var i=0;i<keys.length;i++){var g=grp[keys[i]];
    h+='<div class="review-item" onclick="reviewLevel('+keys[i]+')"><div class="ri-left"><div class="ri-dot"></div><div><div class="ri-title">'+g.name+'</div><div class="ri-sub">'+g.words.length+'个词待复习</div></div></div><div class="ri-badge">去复习</div></div>';
  }
  c.innerHTML=h;
}

function reviewLevel(id){
  var p=load(),ts=today(),lv=null;
  for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].id===id)lv=LEVELS[i];
  if(!lv)return;
  fcWords=[];for(var i=0;i<lv.words.length;i++){var w=lv.words[i],ws=p[w.w];if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')fcWords.push({w:w.w,m:w.m,lid:lv.id,isRev:true,rnd:ws.rnd||0,isH:isHigh(w.w)});}
  fcIdx=0;flipped=false;switchTab('study');showFC();
}

// ====== TAB5: 我的 ======
function renderProfile(c,p){
  var seen=Object.keys(p).filter(function(k){return p[k]&&p[k].s;}).length;
  var mastered=Object.keys(p).filter(function(k){return p[k]&&p[k].nr==='2099-01-01';}).length;
  var done=(p.done||[]).length,acc=p.tc+p.tw>0?Math.round(p.tc/(p.tc+p.tw)*100):0;
  var phase=getPhase(p),pd=getPhaseDay(p);
  c.innerHTML=
    '<div style="padding:24px 16px 0"><div style="font-size:22px;font-weight:800;margin-bottom:2px">我的进度</div><div style="font-size:13px;color:var(--sub)">'+(phase==='high'?'高频速通':'正式背诵')+' · DAY '+pd+'</div></div>'+
    '<div class="stat-row" style="margin-top:16px"><div class="stat-box"><div class="num">'+(p.days||0)+'</div><div class="lbl">学习天数</div></div><div class="stat-box"><div class="num">'+seen+'</div><div class="lbl">已学词汇</div></div><div class="stat-box"><div class="num">'+mastered+'</div><div class="lbl">已掌握</div></div></div>'+
    '<div class="stat-row"><div class="stat-box"><div class="num">'+acc+'%</div><div class="lbl">正确率</div></div><div class="stat-box"><div class="num">'+done+'/30</div><div class="lbl">通关关卡</div></div><div class="stat-box"><div class="num">'+(TOTAL-seen)+'</div><div class="lbl">剩余词汇</div></div></div>'+
    '<div style="padding:0 40px"><button class="btn btn-r btn-blk" onclick="generateProfileCard()">生成学习报告 · 发送给教务老师</button></div>'+
    '<div style="padding:0 40px;margin-top:8px"><button class="btn btn-w btn-blk" onclick="if(confirm(\'确定重置？\')){localStorage.removeItem(\'nana_v\');location.reload();}">重置进度</button></div>';
}

function generateProfileCard(){
  var p=load(),seen=Object.keys(p).filter(function(k){return p[k]&&p[k].s;}).length;
  var mastered=Object.keys(p).filter(function(k){return p[k]&&p[k].nr==='2099-01-01';}).length;
  var acc=p.tc+p.tw>0?Math.round(p.tc/(p.tc+p.tw)*100):0;

  var cvs=document.getElementById('shareCanvas'),ctx=cvs.getContext('2d');
  var w=750,h=1100;
  ctx.clearRect(0,0,w,h);
  var bg=ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#2C1810');bg.addColorStop(.4,'#3D1A1A');bg.addColorStop(.7,'#1A0A0A');bg.addColorStop(1,'#0D0505');
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);

  ctx.fillStyle='rgba(200,60,60,.06)';
  ctx.beginPath();ctx.arc(600,200,300,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(150,800,250,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='28px -apple-system,"PingFang SC",sans-serif';ctx.textAlign='center';
  ctx.fillText('学 囤 囤',w/2,80);
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(60,110);ctx.lineTo(w-60,110);ctx.stroke();

  ctx.fillStyle='#fff';ctx.font='bold 44px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('高考词汇速通关',w/2,170);
  ctx.fillText('学习报告',w/2,220);

  ctx.fillStyle='rgba(255,255,255,.1)';roundRect(ctx,40,270,w-80,380,20);ctx.fill();

  var items=[
    ['学习天数',(p.days||0)+' 天'],
    ['已学词汇',seen+' / '+TOTAL],
    ['已掌握',mastered+' 词'],
    ['通关关卡',(p.done||[]).length+' / 30'],
    ['正确率',acc+'%']
  ];
  ctx.textAlign='center';
  for(var i=0;i<items.length;i++){
    var sy=310+i*72;
    ctx.fillStyle='#fff';ctx.font='bold 36px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(items[i][1],w/2,sy);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='18px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(items[i][0],w/2,sy+28);
  }

  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='18px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(today()+' · NANA学姐出品',w/2,h-60);
  ctx.fillText('扫码加入 高考词汇速通关',w/2,h-30);

  var dataUrl=cvs.toDataURL('image/png');
  var ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML='<div class="modal-box"><h3 style="font-size:18px;font-weight:700;margin-bottom:4px">学习报告打卡图</h3><p style="font-size:13px;color:var(--sub);margin-bottom:12px">长按保存，可发朋友圈或发给教务老师</p><img src="'+dataUrl+'" class="share-preview" alt="学习报告"><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-r" style="flex:1" onclick="saveShareCard()">保存图片</button><button class="btn btn-w" style="flex:1" onclick="this.closest(\'.modal-overlay\').remove()">关闭</button></div></div>';
  document.body.appendChild(ov);ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  ov._imgData=dataUrl;
}
</script>
</body>
</html>
