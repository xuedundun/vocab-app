.quiz-opt.correct{border-color:#27AE60;background:#E8F8F0}
.quiz-opt.wrong{border-color:#E74C3C;background:#FDE8E8}

(h+S1(e)+c(e,f,g)+K[t]+W[t])>>>0;var T2=(S0(a)+M(a,bb,cc))>>>0;h=g;g=f;f=e;e=(d+T1)>>>0;d=cc;cc=bb;bb=a;a=(T1+T2)>>>0}H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+cc)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0}return H.map(function(x){return x.toString(16).padStart(8,'0')}).join('')}

var tab = 'study';
var fcIdx = 0, fcWords = [];
var qzIdx = 0, qzWords = [], qzScore = 0;
var flipped = false;

function today(){ return new Date().toISOString().slice(0,10); }
function load(){ try{ return JSON.parse(localStorage.getItem('xd_v')||'{}'); }catch(e){ return {}; } }
function save(d){ localStorage.setItem('xd_v',JSON.stringify(d)); }
function toast(m){ var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1500); }

// ====== 激活 ======
function doActivate(){
  var inp=document.getElementById('inviteInput').value.trim().toUpperCase();
  var err=document.getElementById('inviteError');
  var btn=document.getElementById('inviteBtn');
  if(!inp||inp.length<10){ err.textContent='请输入有效邀请码';return; }
  btn.textContent='验证中...';btn.disabled=true;err.textContent='';
  setTimeout(function(){
    try{
      var h=sha256(SALT+inp).slice(0,16);
      if(CODE_HASHES.has(h)){
        try{ localStorage.setItem('xd_act','1'); }catch(e){}
        document.getElementById('activateScreen').style.display='none';
        document.getElementById('app').style.display='block';
        document.getElementById('tabs').style.display='flex';
        render();toast('激活成功！');
      }else{
        err.textContent='邀请码无效';
        btn.textContent='激活并开始使用';btn.disabled=false;
      }
    }catch(e){ err.textContent='验证失败，请刷新重试';btn.textContent='激活并开始使用';btn.disabled=false; }
  },50);
}

// 输入格式化
document.getElementById('inviteInput').addEventListener('input',function(){
  var v=this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  if(v.length>8)v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
  else if(v.length>4)v=v.slice(0,3)+'-'+v.slice(4,8);

});

// ====== 路由 ======
function switchTab(t){ tab=t;document.querySelectorAll('.tab').forEach(function(el){el.classList.toggle('active',el.dataset.tab===t);});render(); }
document.getElementById('tabs').addEventListener('click',function(e){ var el=e.target.closest('.tab');if(el)switchTab(el.dataset.tab); });

// ====== 获取今日词 ======
function todayWords(){
  var p=load(),ts=today(),words=[],unlocked=getUnlocked(p);
  for(var i=0;i<unlocked.length;i++){ var lv=unlocked[i];
    for(var j=0;j<lv.words.length;j++){ var w=lv.words[j],ws=p[w.w]||{}; if(!ws.seen)words.push({w:w.w,m:w.m,lid:lv.id,new:true}); }
  }
  for(var i=0;i<LEVELS.length;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){ var w=lv.words[j],ws=p[w.w]; if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')words.push({w:w.w,m:w.m,lid:lv.id,rev:true,rnd:ws.rnd||0}); }
  }
  var nw=words.filter(function(w){return w.new;}).slice(0,30);
  var rw=words.filter(function(w){return w.rev;});
  return rw.concat(nw);
}

function getUnlocked(p){
  var u=[];
  for(var i=0;i<LEVELS.length;i++){ var lv=LEVELS[i];
    if(lv.id===1){ u.push(lv);continue; }
    var prev=null; for(var j=0;j<(p.done||[]).length;j++){ if(p.done[j].id===lv.id-1){ prev=p.done[j];break;} }
    if(prev&&prev.stars>=1)u.push(lv);
  }
  return u;
}

// ====== 渲染 ======
function render(){
  var p=load(),c=document.getElementById('mainContent');
  updateBadge(p);
  if(tab==='study')renderStudy(c,p);
  else if(tab==='levels')renderLevels(c,p);
  else if(tab==='review')renderReview(c,p);
  else if(tab==='profile')renderProfile(c,p);
}

function updateBadge(p){
  var ts=today(),cnt=0;
  for(var i=0;i<LEVELS.length;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){ var ws=p[lv.words[j].w]; if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')cnt++; }
  }
  var b=document.getElementById('rvBadge');
  if(cnt>0){ b.style.display='inline';b.textContent=cnt>99?'99+':cnt; } else b.style.display='none';
}

// ====== TAB1: 背诵 ======
function renderStudy(c,p){
  var words=todayWords();
  if(!words.length){ c.innerHTML='<div class="empty"><div class="ic">🎉</div><h3>今天没有要背的词</h3><p>去闯关挑战解锁新词吧~</p></div>';return; }
  fcWords=words;fcIdx=0;flipped=false;
  var nc=words.filter(function(w){return w.new;}).length,rc=words.length-nc;
  c.innerHTML='<div class="card" style="text-align:center"><div class="card-title">📝 今日背诵</div><div style="font-size:13px;color:#999">🆕'+nc+' | 🔄'+rc+' | 共'+words.length+'词</div><div class="progress-bar"><div class="progress-fill" id="sp" style="width:0%"></div></div></div><div class="flashcard" id="fc" onclick="flip()"><span class="tag" id="fct"></span><div class="w" id="fcw"></div><div class="m" id="fcm" style="display:none"></div><div class="hint" id="fch">👆 点击翻转查看释义</div></div><div id="fca" style="display:none;display:flex;gap:12px;margin-top:16px"><button class="btn btn-b" style="border:2px solid #2C3E6B;color:#2C3E6B;background:transparent" onclick="mark(false)">😕 不认识</button><button class="btn btn-o btn-b" onclick="mark(true)">✅ 认识了</button></div><div style="text-align:center;margin-top:12px;font-size:13px;color:#999" id="fcc"></div>';
  showFC();
}

function showFC(){
  if(fcIdx>=fcWords.length){ var p=load(); if(p.ld!==today()){ p.days=(p.days||0)+1;p.ld=today();save(p); } c=document.getElementById('mainContent'); c.innerHTML='<div class="empty"><div class="ic">🎉</div><h3>今日背诵完成！</h3><p>连续第'+(p.days||0)+'天，太棒了！</p><button class="btn btn-p" style="margin-top:16px" onclick="switchTab('levels')">去闯关 →</button></div>';return; }
  var w=fcWords[fcIdx];flipped=false;
  document.getElementById('fcw').textContent=w.w;
  document.getElementById('fcm').textContent=w.m;
  document.getElementById('fcm').style.display='none';
  document.getElementById('fch').style.display='block';
  document.getElementById('fca').style.display='none';
  document.getElementById('fct').textContent=w.new?'🆕 新词':'🔄 第'+(w.rnd+1)+'次复习';
  document.getElementById('fct').style.background=w.new?'#E8F8F0':'#FFF3E0';
  document.getElementById('fcc').textContent=(fcIdx+1)+'/'+fcWords.length;
  document.getElementById('sp').style.width=(fcIdx/fcWords.length*100)+'%';
}

function flip(){ if(flipped)return;flipped=true;document.getElementById('fcm').style.display='block';document.getElementById('fch').style.display='none';document.getElementById('fca').style.display='flex'; }

function mark(ok){
  var w=fcWords[fcIdx],p=load(),k=w.w,ws=p[k]||{s:false,c:0,w:0,rnd:0,nr:''};
  ws.s=true; if(ok){ ws.c++;p.tc=(p.tc||0)+1;ws.rnd=Math.min(ws.rnd+1,EBB.length);
    if(ws.rnd<EBB.length){ var d=new Date();d.setDate(d.getDate()+EBB[ws.rnd]);ws.nr=d.toISOString().slice(0,10); } else ws.nr='2099-01-01';
  }else{ ws.w++;p.tw=(p.tw||0)+1;ws.rnd=0;var d=new Date();d.setDate(d.getDate()+1);ws.nr=d.toISOString().slice(0,10); }
  p[k]=ws;save(p);fcIdx++;showFC();
}

// ====== TAB2: 闯关 ======
function renderLevels(c,p){
  var unlocked=getUnlocked(p),uid={};
  for(var i=0;i<unlocked.length;i++)uid[unlocked[i].id]=true;
  var h='<div class="card"><div class="card-title">🎯 闯关挑战</div><div style="font-size:13px;color:#999">30关·高频→中频→基础·通关解锁下一关</div></div><div class="level-grid">';
  for(var i=0;i<LEVELS.length;i++){ var lv=LEVELS[i],done=null;
    for(var j=0;j<(p.done||[]).length;j++){ if(p.done[j].id===lv.id){ done=p.done[j];break;} }
    var lk=!uid[lv.id],tc=lv.tier==='high'?'#E74C3C':lv.tier==='mid'?'#2C3E6B':'#999';
    h+='<div class="level-item'+(lk?' locked':'')+'"'+(lk?'':' onclick="startQuiz('+lv.id+')"')+'>'+(lk?'<div style="position:absolute;top:6px;right:8px;font-size:14px">🔒</div>':'')+'<div class="lv-num" style="color:'+tc+'">Lv'+lv.id+'</div><div class="lv-name">'+lv.name.slice(0,6)+'</div><div style="font-size:14px;margin-top:4px">'+(done?'⭐'.repeat(done.stars):'☆☆☆')+'</div></div>';
  }
  h+='</div>';c.innerHTML=h;
}

function startQuiz(id){
  var lv=null;for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].id===id)lv=LEVELS[i];
  if(!lv)return;
  var ws=lv.words.slice().sort(function(){return Math.random()-.5});
  qzWords=ws.slice(0,Math.min(20,ws.length));qzIdx=0;qzScore=0;
  showQuiz();
}

function showQuiz(){
  if(qzIdx>=qzWords.length){ finishQuiz();return; }
  var w=qzWords[qzIdx],all=[];
  for(var i=0;i<LEVELS.length;i++)all=all.concat(LEVELS[i].words);
  var wrong=all.filter(function(x){return x.w!==w.w;}).sort(function(){return Math.random()-.5}).slice(0,3).map(function(x){return x.m;});
  var opts=wrong.concat([w.m]).sort(function(){return Math.random()-.5});
  var ci=opts.indexOf(w.m);
  document.getElementById('mainContent').innerHTML='<div class="card" style="text-align:center"><div class="card-title">🎯 Level '+qzWords[0].lid+' 闯关</div><div style="font-size:13px;color:#999">'+(qzIdx+1)+'/'+qzWords.length+' | ✅'+qzScore+'</div><div class="progress-bar"><div class="progress-fill" style="width:'+(qzIdx/qzWords.length*100)+'%"></div></div></div><div class="quiz-word">'+w.w+'</div><div class="quiz-options" id="qzOpts">'+opts.map(function(o,i){return '<div class="quiz-opt" data-ci="'+(i===ci)+'" onclick="answerQuiz(this)">'+o+'</div>';}).join('')+'</div><button class="btn btn-b" style="border:2px solid #2C3E6B;color:#2C3E6B;background:transparent;margin-top:16px" onclick="switchTab('levels')">退出</button>';
}

function answerQuiz(el){
  var ok=el.dataset.ci==='true',opts=document.querySelectorAll('#qzOpts .quiz-opt');
  for(var i=0;i<opts.length;i++)opts[i].style.pointerEvents='none';
  if(ok){ el.classList.add('correct');qzScore++;toast('✅'); }
  else{ el.classList.add('wrong');for(var i=0;i<opts.length;i++)if(opts[i].dataset.ci==='true')opts[i].classList.add('correct');toast('❌'); }
  setTimeout(function(){ qzIdx++;showQuiz(); },800);
}

function finishQuiz(){
  var pct=Math.round(qzScore/qzWords.length*100),stars=pct>=95?3:pct>=80?2:pct>=60?1:0,ok=stars>=2;
  var p=load(),lvId=qzWords[0].lid,ex=null;
  for(var i=0;i<(p.done||[]).length;i++)if(p.done[i].id===lvId)ex=p.done[i];
  if(!ex||stars>ex.stars){ if(ex){ ex.stars=stars;ex.date=today(); } else{ p.done=(p.done||[]);p.done.push({id:lvId,stars:stars,date:today()}); } save(p); }
  document.getElementById('mainContent').innerHTML='<div class="empty"><div class="ic">'+(ok?'🎉':'💪')+'</div><h3>'+(ok?'恭喜通关！':'继续加油！')+'</h3><p>正确率'+pct+'% | '+qzScore+'/'+qzWords.length+'</p><div style="font-size:32px">'+'⭐'.repeat(stars)+'☆'.repeat(3-stars)+'</div>'+(ok&&lvId<30?'<button class="btn btn-o" style="margin-top:12px" onclick="startQuiz('+(lvId+1)+')">下一关 →</button>':'')+(stars<2?'<button class="btn btn-o" style="margin-top:12px" onclick="startQuiz('+lvId+')">🔄 重新挑战</button>':'')+'<button class="btn btn-p" style="margin-top:8px" onclick="switchTab('levels')">返回关卡</button></div>';
}

// ====== TAB3: 复习 ======
function renderReview(c,p){
  var ts=today(),words=[];
  for(var i=0;i<LEVELS.length;i++){ var lv=LEVELS[i];
    for(var j=0;j<lv.words.length;j++){ var w=lv.words[j],ws=p[w.w];if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')words.push({w:w.w,m:w.m,lid:lv.id,name:lv.name}); }
  }
  if(!words.length){ c.innerHTML='<div class="empty"><div class="ic">✅</div><h3>没有待复习的词</h3><p>都在按计划复习中~</p></div>';return; }
  var grp={};
  for(var i=0;i<words.length;i++){ var rw=words[i];if(!grp[rw.lid])grp[rw.lid]={name:rw.name,words:[]};grp[rw.lid].words.push(rw); }
  var h='<div class="card"><div class="card-title">📊 复习提醒</div><div style="font-size:13px;color:#999">今日待复习 '+words.length+' 词</div></div>';
  var keys=Object.keys(grp);
  for(var i=0;i<keys.length;i++){ var g=grp[keys[i]];h+='<div class="card" style="cursor:pointer" onclick="reviewLevel('+keys[i]+')"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:15px;font-weight:600">'+g.name+'</div><div style="font-size:12px;color:#999">'+g.words.length+'词待复习</div></div><span style="background:#E74C3C;color:#fff;padding:6px 14px;border-radius:15px;font-size:13px">去复习→</span></div></div>'; }
  c.innerHTML=h;
}

function reviewLevel(id){
  var p=load(),ts=today(),lv=null;
  for(var i=0;i<LEVELS.length;i++)if(LEVELS[i].id===id)lv=LEVELS[i];
  if(!lv)return;
  fcWords=[];for(var i=0;i<lv.words.length;i++){ var w=lv.words[i],ws=p[w.w];if(ws&&ws.nr&&ws.nr<=ts&&ws.nr!=='2099-01-01')fcWords.push({w:w.w,m:w.m,lid:lv.id,rev:true,rnd:ws.rnd||0}); }
  fcIdx=0;flipped=false;switchTab('study');
  setTimeout(function(){
    document.getElementById('mainContent').innerHTML='<div class="card" style="text-align:center"><div class="card-title">📊 复习模式</div><div style="font-size:13px;color:#999">'+lv.name+'·'+fcWords.length+'词</div><div class="progress-bar"><div class="progress-fill" id="sp" style="width:0%"></div></div></div><div class="flashcard" id="fc" onclick="flip()"><span class="tag" id="fct"></span><div class="w" id="fcw"></div><div class="m" id="fcm" style="display:none"></div><div class="hint" id="fch">👆 点击翻转</div></div><div id="fca" style="display:none;display:flex;gap:12px;margin-top:16px"><button class="btn btn-b" style="border:2px solid #2C3E6B;color:#2C3E6B;background:transparent" onclick="mark(false)">😕 不认识</button><button class="btn btn-o btn-b" onclick="mark(true)">✅ 认识了</button></div><div style="text-align:center;margin-top:12px;font-size:13px;color:#999" id="fcc"></div>';
    showFC();
  },100);
}

}

  else{
    var ov=document.createElement('div');ov.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center';
    ov.innerHTML='<div style="background:#fff;border-radius:14px;padding:24px;width:90%;max-width:400px"><h3>📤 分享进度</h3><div style="background:#F5F7FA;padding:12px;border-radius:8px;font-size:13px;margin:12px 0;white-space:pre-wrap">'+txt.replace(/\n/g,'<br>')+'</div><button class="btn btn-p btn-b" onclick="var t=this.parentElement.parentElement;navigator.clipboard.writeText(t._txt).then(function(){alert('已复制！');t.remove();})">📋 一键复制</button></div>';
    ov.querySelector('.modal')._txt=txt;
    document.body.appendChild(ov);ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  }
}

// ====== 启动 ======
(function(){
  var act=false;
  try{ act=localStorage.getItem('xd_act')==='1'; }catch(e){}
  if(act){
    document.getElementById('activateScreen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('tabs').style.display='flex';
    try{ render(); }catch(e){ document.getElementById('mainContent').innerHTML='<div class="empty"><div class="ic">⚠️</div><h3>加载出错</h3><p>'+e.message+'</p><button class="btn btn-p" onclick="location.reload()">刷新</button></div>'; }
  }else{
    document.getElementById('activateScreen').style.display='flex';
    setTimeout(function(){ var i=document.getElementById('inviteInput');if(i)i.focus(); },500);
  }
})();
</script>
