<title>学囤囤 · 高考词汇闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC',-apple-system,sans-serif;background:#58CC02;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.box{text-align:center;color:#fff;max-width:320px;width:100%}
h2{font-size:22px;font-weight:700;margin:8px 0 4px}
input{width:100%;padding:14px;border-radius:12px;border:none;font-size:18px;text-align:center;letter-spacing:2px;font-family:monospace;margin-top:16px}
input::placeholder{font-size:14px;letter-spacing:1px}
button{width:100%;padding:14px;border-radius:25px;background:#E8734A;color:#fff;border:none;font-size:17px;font-weight:600;margin-top:12px;cursor:pointer}
button:active{opacity:.8}
button:disabled{opacity:.5}
.err{color:#FF6B6B;font-size:13px;margin-top:8px;min-height:20px}
.hint{font-size:11px;opacity:.5;margin-top:16px}
</style>

<body>
<div class="box">
  <div style="font-size:64px;animation:bounce .6s infinite alternate">🦉</div>
<style>@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}</style>
  <h2>学囤囤 · 高考词汇闯关</h2>
  <p style="font-size:13px;opacity:.8">内部学员专属 · 输入邀请码激活</p>
  <input id="code" type="text" placeholder="XDD-XXXX-XXXX" autocomplete="off" autocapitalize="characters" maxlength="14">
  <div class="err" id="err"></div>
  <button id="btn" onclick="activate()">激活并开始使用</button>
  <div class="hint">邀请码由教务老师发放</div>
</div>

<script>

var SALT = "xuedundun_salt_";

function activate(){
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');
  var code = document.getElementById('code').value.trim().toUpperCase();
  
  if(!code || code.length < 10){ err.textContent = '请输入有效邀请码'; return; }
  
  btn.textContent = '验证中...';
  btn.disabled = true;
  err.textContent = '';
  
  setTimeout(function(){
    try {
      var h = sha256(SALT + code).slice(0,16);
      if (HASHES.indexOf(h) >= 0) {
        localStorage.setItem('xd_act', '1');
        localStorage.setItem('xd_code', code);
        window.location.href = 'app.html';
      } else {
        err.textContent = '邀请码无效，请检查后重试';
        btn.textContent = '激活并开始使用';
        btn.disabled = false;
      }
    } catch(e) {
      err.textContent = '验证失败，请刷新重试';
      btn.textContent = '激活并开始使用';
      btn.disabled = false;
    }
  }, 50);
}

document.getElementById('code').addEventListener('input', function(){
  var v = this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  if(v.length>8)v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
  else if(v.length>4)v=v.slice(0,3)+'-'+v.slice(4,8);
  this.value=v.slice(0,14);
});

document.getElementById('code').addEventListener('keydown', function(e){
  if(e.key === 'Enter') activate();
});

// Check if already activated
if (localStorage.getItem('xd_act') === '1') {
  window.location.href = 'app.html';
}
</script>
